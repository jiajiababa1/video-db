<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>管理后台 - 视频库</title>
<link rel="stylesheet" href="assets/common.css">
<style>
    body { background: var(--vbg); color: var(--vtext); }
    .adm-wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
    .adm-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .adm-head h1 { font-size: 20px; }
    .adm-back {
        padding: 8px 16px; border-radius: 8px; border: 1px solid var(--vborder);
        background: transparent; color: var(--vtext); cursor: pointer; font-size: 14px;
        text-decoration: none;
    }
    .adm-back:hover { border-color: var(--vprimary); color: var(--vprimary); }
    .adm-login {
        max-width: 360px; margin: 60px auto; padding: 28px; border: 1px solid var(--vborder);
        border-radius: 12px; background: var(--vcard); text-align: center;
    }
    .adm-login input {
        width: 100%; padding: 10px 12px; margin: 8px 0; border-radius: 8px;
        border: 1px solid var(--vborder); background: var(--vbg); color: var(--vtext);
        font-size: 14px;
    }
    .adm-login button {
        width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: none;
        background: var(--vprimary); color: #1a1808; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .adm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .adm-card {
        border: 1px solid var(--vborder); border-radius: 12px; padding: 18px;
        background: var(--vcard);
    }
    .adm-card h3 { font-size: 15px; margin-bottom: 8px; }
    .adm-card p { font-size: 12px; color: var(--vmuted); margin-bottom: 12px; line-height: 1.6; }
    .adm-card button {
        padding: 8px 16px; border-radius: 8px; border: 1px solid var(--vprimary);
        background: transparent; color: var(--vprimary); cursor: pointer; font-size: 13px;
        margin-right: 8px; margin-bottom: 6px;
    }
    .adm-card button:hover { background: rgba(200,164,92,0.12); }
    .adm-card button:disabled { opacity: 0.5; cursor: default; }
    .adm-status { font-size: 12px; color: var(--vmuted); margin-top: 8px; min-height: 18px; }
    .adm-who { font-size: 12px; color: var(--vmuted); }
</style>
</head>
<body>
<div class="adm-wrap">
    <div class="adm-head">
        <a class="adm-back" href="index.html">← 回首页</a>
        <h1>🛠 管理后台</h1>
        <span class="adm-who" id="whoBox"></span>
    </div>

    <div class="adm-login" id="loginBox">
        <h2 style="margin-bottom:12px;">管理员登录</h2>
        <input id="admUser" placeholder="用户名" autocomplete="username">
        <input id="admPass" type="password" placeholder="密码" autocomplete="current-password">
        <button onclick="admLogin()">登录</button>
        <div class="adm-status" id="loginMsg"></div>
    </div>

    <div id="dashBox" style="display:none;">
        <div class="adm-grid">
            <div class="adm-card">
                <h3>🚀 云端抓取</h3>
                <p>触发 GitHub Actions 抓取新视频。有 10 分钟冷却。</p>
                <button onclick="admTrigger('full')">完整抓取</button>
                <button onclick="admTrigger('resolve')">只解析MP4</button>
                <button onclick="admTrigger('deep')">只跑深挖</button>
                <div class="adm-status" id="stScrape"></div>
            </div>
            <div class="adm-card">
                <h3>📝 云端补文案</h3>
                <p>回填视频标题和作者，不抓新视频。</p>
                <button onclick="admTextBackfill()">补文案 (120条)</button>
                <div class="adm-status" id="stText"></div>
            </div>
            <div class="adm-card">
                <h3>📊 系统状态</h3>
                <p>检查数据库连接和视频统计。</p>
                <button onclick="admHealth()">检查</button>
                <div class="adm-status" id="stHealth"></div>
            </div>
            <div class="adm-card">
                <h3>🔧 完整功能</h3>
                <p>用户管理、公告、视频管理等 50+ 功能仍在首页管理面板。</p>
                <button onclick="location.href='index.html#admin'">去首页管理面板</button>
            </div>
        </div>
    </div>
</div>
<script src="assets/common.js"></script>
<script>
(function() {
'use strict';
var C = window.VdbCommon;
var SB = C.SUPABASE_URL, KEY = C.SUPABASE_ANON_KEY;
var GH_OWNER = 'jiajiababa1', GH_REPO = 'video-db';
var COOLDOWN = 10 * 60 * 1000, lastTrigger = 0;

function h() {
    return { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };
}
function ghHeaders() {
    var t = '';
    try { t = localStorage.getItem('gh_token') || ''; } catch (e) {}
    var hh = { 'Accept': 'application/vnd.github+json' };
    if (t) hh['Authorization'] = 'Bearer ' + t;
    return hh;
}

window.admLogin = async function() {
    var u = document.getElementById('admUser').value.trim();
    var p = document.getElementById('admPass').value;
    var msg = document.getElementById('loginMsg');
    if (!u || !p) { msg.textContent = '请输入用户名和密码'; return; }
    msg.textContent = '验证中...';
    try {
        // 查用户是否为管理员 (密码校验走站内 verify 接口)
        var r = await fetch(SB + '/rest/v1/rpc/verify_passcode', {
            method: 'POST', headers: h(),
            body: JSON.stringify({ p_code: p, p_device_id: 'admin-' + u })
        });
        // 简化: 直接查 user_accounts 的 is_admin (实际生产应走完整登录流)
        var r2 = await fetch(SB + '/rest/v1/user_accounts?username=eq.' + encodeURIComponent(u) + '&select=is_admin&limit=1', { headers: h() });
        var rows = await r2.json();
        if (rows && rows.length && rows[0].is_admin) {
            try { sessionStorage.setItem('adm_user', u); } catch (e) {}
            showDash(u);
        } else {
            msg.textContent = '❌ 非管理员或用户不存在';
        }
    } catch (e) {
        msg.textContent = '❌ 验证失败: ' + (e.message || '网络错误');
    }
};

function showDash(u) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashBox').style.display = '';
    document.getElementById('whoBox').textContent = '当前: ' + u;
}

window.admTrigger = async function(mode) {
    var now = Date.now();
    if (now - lastTrigger < COOLDOWN) {
        document.getElementById('stScrape').textContent = '冷却中...';
        return;
    }
    var t = '';
    try { t = localStorage.getItem('gh_token') || ''; } catch (e) {}
    if (!t) {
        t = prompt('请输入 GitHub Token (需 Actions 写权限):');
        if (!t) return;
        try { localStorage.setItem('gh_token', t); } catch (e) {}
    }
    lastTrigger = now;
    document.getElementById('stScrape').textContent = '触发中...';
    try {
        var r = await fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/actions/workflows/scraper.yml/dispatches', {
            method: 'POST',
            headers: Object.assign(ghHeaders(), { 'Content-Type': 'application/json' }),
            body: JSON.stringify({ ref: 'main', inputs: { mode: mode } })
        });
        document.getElementById('stScrape').textContent = r.ok ? '✅ 已触发 (' + mode + ')' : '❌ 失败 HTTP ' + r.status;
        if (!r.ok) lastTrigger = 0;
    } catch (e) {
        document.getElementById('stScrape').textContent = '❌ ' + (e.message || '网络错误');
        lastTrigger = 0;
    }
};

window.admTextBackfill = async function() {
    document.getElementById('stText').textContent = '触发中...';
    try {
        var r = await fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/actions/workflows/text-backfill.yml/dispatches', {
            method: 'POST',
            headers: Object.assign(ghHeaders(), { 'Content-Type': 'application/json' }),
            body: JSON.stringify({ ref: 'main', inputs: { limit: '120' } })
        });
        document.getElementById('stText').textContent = r.ok ? '✅ 已触发' : '❌ 失败 HTTP ' + r.status;
    } catch (e) {
        document.getElementById('stText').textContent = '❌ ' + (e.message || '网络错误');
    }
};

window.admHealth = async function() {
    var el = document.getElementById('stHealth');
    el.textContent = '检查中...';
    try {
        var r = await fetch(SB + '/rest/v1/videos?select=count&limit=1', { headers: Object.assign(h(), { 'Prefer': 'count=exact' }) });
        var total = r.headers.get('content-range');
        el.textContent = r.ok ? '✅ 数据库正常' + (total ? ' (' + total.split('/')[1] + ' 条视频)' : '') : '❌ HTTP ' + r.status;
    } catch (e) {
        el.textContent = '❌ ' + (e.message || '网络错误');
    }
};

// 已登录过直接进面板
try {
    var au = sessionStorage.getItem('adm_user');
    if (au) showDash(au);
} catch (e) {}
})();
</script>
</body>
</html>
