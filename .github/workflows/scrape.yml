# monsnode 爬虫 — GitHub Actions 每 30 分钟自动运行
# 无需本地电脑, 完全免费 (公开仓库)

name: Monsnode Scraper (30min)

on:
  # 定时触发已禁用 — 请改用 scraper.yml (v7 每2小时)
  # schedule:
  #   - cron: "*/30 * * * *"
  # 支持手动触发
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Playwright + 依赖 (含 stealth)
        run: |
          pip install playwright playwright-stealth beautifulsoup4 lxml httpx
          playwright install --with-deps chromium

      - name: 运行爬虫
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper/main.py

      - name: 上传调试截图 (失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: /tmp/monsnode_debug.png
