# monsnode 一站式爬虫: 抓取 → 解析重定向 → 获取 MP4 → 存入 Supabase
# Playwright 绕过 Cloudflare + curl_cffi 调 fxtwitter API

name: Daily Video Scraper

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install playwright beautifulsoup4 lxml httpx curl_cffi
          playwright install --with-deps chromium

      - name: 运行爬虫
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scraper/main.py
