name: __setpages__
on:
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }}/pages || true
      - name: try configure-pages enablement
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - name: try put build_type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"build_type":"workflow"}' | gh api -X PUT repos/${{ github.repository }}/pages --input - || true
      - name: after
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }}/pages || true
