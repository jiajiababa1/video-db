<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>验证 - VideoDB</title>
<link rel="stylesheet" href="assets/common.css">
<style>
    body {
        background: var(--vbg); color: var(--vtext); min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse 600px 400px at 50% 30%, rgba(200,164,92,.08), transparent),
                    var(--vbg);
    }
    .pwd-box { text-align: center; padding: 20px; max-width: 360px; width: 100%; }
    .pwd-logo { font-size: 42px; margin-bottom: 8px; }
    .pwd-logo span { color: var(--vprimary); }
    .pwd-sub { color: var(--vmuted); font-size: 13px; margin-bottom: 28px; }
    .pwd-digits { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
    .pwd-digits input {
        width: 56px; height: 64px; text-align: center; font-size: 28px;
        border-radius: 12px; border: 1px solid var(--vborder);
        background: var(--vcard); color: var(--vtext); outline: none;
    }
    .pwd-digits input:focus { border-color: var(--vprimary); }
    .pwd-digits input.error { border-color: #c08080; animation: shake .3s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .pwd-hint { font-size: 12px; color: var(--vmuted); min-height: 20px; margin-bottom: 16px; }
    .pwd-lock { color: #c08080; font-size: 13px; }
    .pwd-policies {
        margin-top: 32px; text-align: left; font-size: 11px; color: var(--vmuted);
        border-top: 1px solid var(--vborder); padding-top: 16px; line-height: 2;
    }
    .pwd-policies b { color: var(--vprimary); }
</style>
</head>
<body>
<div class="pwd-box">
    <div class="pwd-logo">Video<span>DB</span></div>
    <div class="pwd-sub">请输入 4 位密码进入应用</div>
    <div class="pwd-digits" id="digits">
        <input type="password" inputmode="numeric" maxlength="1" data-i="0">
        <input type="password" inputmode="numeric" maxlength="1" data-i="1">
        <input type="password" inputmode="numeric" maxlength="1" data-i="2">
        <input type="password" inputmode="numeric" maxlength="1" data-i="3">
    </div>
    <div class="pwd-hint" id="hint"></div>
    <div class="pwd-policies">
        🛡 <b>安全策略</b><br>
        · 5 次输错锁定 15 分钟<br>
        · 登录后 2 小时无操作自动锁定<br>
        · 设备绑定，换设备需重新验证<br>
        · 所有登录尝试均被审计记录
    </div>
</div>
<script src="assets/common.js"></script>
<script src="assets/gate.js"></script>
<script>
(function() {
'use strict';
var C = window.VdbCommon, G = window.VdbGate;
var SB = C.SUPABASE_URL, KEY = C.SUPABASE_ANON_KEY;
var inputs = Array.prototype.slice.call(document.querySelectorAll('#digits input'));
var hint = document.getElementById('hint');

// 已登录直接跳走
if (G.tokenValid()) {
    var nx = new RegExp('[?&]next=([^&]*)').exec(location.search);
    location.replace(nx ? decodeURIComponent(nx[1]) : 'index.html');
}

// P3: 检查锁定
var lockMin = G.isLocked();
if (lockMin > 0) {
    hint.innerHTML = '<span class="pwd-lock">🔒 失败次数过多，已锁定 ' + lockMin + ' 分钟</span>';
    inputs.forEach(function(i) { i.disabled = true; });
}

inputs.forEach(function(inp, idx) {
    inp.addEventListener('input', function() {
        inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
        if (inp.value && idx < 3) inputs[idx + 1].focus();
        check();
    });
    inp.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !inp.value && idx > 0) inputs[idx - 1].focus();
    });
    // 粘贴 4 位
    inp.addEventListener('paste', function(e) {
        var t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
        if (t.length === 4) {
            e.preventDefault();
            t.split('').forEach(function(ch, i) { inputs[i].value = ch; });
            check();
        }
    });
});
inputs[0].focus();

async function check() {
    var code = inputs.map(function(i) { return i.value; }).join('');
    if (code.length !== 4) return;
    if (G.isLocked() > 0) return;
    hint.textContent = '验证中…';
    try {
        var r = await fetch(SB + '/rest/v1/rpc/verify_passcode', {
            method: 'POST',
            headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p_code: code, p_device_id: G.deviceId() })
        });
        var j = r.ok ? await r.json() : null;
        if (j && j.length && j[0].ok && j[0].token) {
            G.clearFail();
            try {
                localStorage.setItem('vid_gate_token', j[0].token);
                localStorage.setItem('vid_gate_ts', String(Date.now()));
            } catch (e) {}
            G.audit('login_ok', '');
            hint.innerHTML = '<span style="color:#7ab87a;">✅ 验证通过</span>';
            setTimeout(function() {
                var nx = new RegExp('[?&]next=([^&]*)').exec(location.search);
                location.replace(nx ? decodeURIComponent(nx[1]) : 'index.html');
            }, 400);
        } else {
            throw new Error('bad');
        }
    } catch (e) {
        G.recordFail();
        G.audit('login_fail', '');
        var left = G.MAX_FAIL - (JSON.parse(localStorage.getItem('gate_fail') || '{"count":0}').count);
        inputs.forEach(function(i) { i.classList.add('error'); });
        var lm = G.isLocked();
        hint.innerHTML = lm > 0
            ? '<span class="pwd-lock">🔒 已锁定 ' + lm + ' 分钟</span>'
            : '<span style="color:#c08080;">密码错误，还剩 ' + left + ' 次机会</span>';
        setTimeout(function() {
            inputs.forEach(function(i) { i.value = ''; i.classList.remove('error'); });
            if (G.isLocked() > 0) inputs.forEach(function(i) { i.disabled = true; });
            else inputs[0].focus();
        }, 800);
    }
}
})();
</script>
</body>
</html>
