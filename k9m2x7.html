<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
<script>
/* env-guard: 官方站点运行环境校验 (防整站下载盗用) */
(function(){
  var _d = function(a){ return String.fromCharCode.apply(null, a); };
  /* 白名单主机: jiajiababa1.github.io (charcode 存放, 防文本搜索定位) */
  var _H = [[106,105,97,106,105,97,98,97,98,97,49,46,103,105,116,104,117,98,46,105,111]];
  function _ok(){
    try{
      var h = String(location.hostname||'').toLowerCase();
      var p = String(location.protocol||'').toLowerCase();
      if(p!=='https:' && p!=='http:') return false; /* file:/data: 等本地打开直接拦 */
      if(window.top!==window.self) return false;      /* 禁止被第三方页面 iframe 嵌入 */
      for(var i=0;i<_H.length;i++){ if(h===_d(_H[i])) return true; }
      return false;
    }catch(e){ return false; }
  }
  function _lock(){
    if(window.__vdb_locked) return;
    window.__vdb_locked = true;
    try{ /* 清掉本机鉴权残留, 防 token 被盗用 */
      var ks=['vid_gate_token','login_token','gh_token','sb_token'];
      for(var i=0;i<ks.length;i++){
        try{ localStorage.removeItem(ks[i]); }catch(e){}
        try{ sessionStorage.removeItem(ks[i]); }catch(e){}
      }
    }catch(e){}
    try{ /* 熔断网络: 全部数据接口失效, 列表/播放/登录/解析统统不可用 */
      window.fetch = function(){ return Promise.reject(new Error('net blocked')); };
      if(window.XMLHttpRequest){ window.XMLHttpRequest = function(){ throw new Error('net blocked'); }; }
    }catch(e){}
    try{ /* 锁屏覆盖 */
      var css=document.createElement('style');
      css.textContent='html.__vdb_locked body>*{display:none!important}';
      document.documentElement.appendChild(css);
      document.documentElement.classList.add('__vdb_locked');
      var box=document.createElement('div');
      box.setAttribute('style','position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#08080a;color:#e4e0d8;font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;text-align:center;padding:24px;');
      box.innerHTML='<div><div style="font-size:44px;margin-bottom:16px;">🔒</div><div style="font-size:17px;font-weight:700;margin-bottom:10px;">此页面仅可在官方站点使用</div><div style="font-size:13px;color:#8a8578;line-height:1.9;">检测到当前访问地址非官方站点,<br>全部功能已被禁用。<br><br>请前往官方地址:<br><a href="https://jiajiababa1.github.io/video-db/" style="color:#c8a45c;">jiajiababa1.github.io/video-db</a></div></div>';
      document.documentElement.appendChild(box);
    }catch(e){}
  }
  if(!_ok()){ _lock(); }
  setInterval(function(){ if(!window.__vdb_locked && !_ok()){ _lock(); } }, 4000); /* 运行中持续复查 */
})();
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>动态密码</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#08080a; color:#e4e0d8;
            font-family:Georgia,'Times New Roman','Noto Serif SC',serif;
            display:flex; align-items:center; justify-content:center;
            min-height:100vh; text-align:center; padding:24px;
            -webkit-tap-highlight-color:transparent;
        }
        .wrap { max-width:340px; width:100%; }
        .icon { font-size:48px; margin-bottom:20px; }
        h1 { font-size:14px; font-weight:400; color:#6b6760; margin-bottom:8px; letter-spacing:2px; text-transform:uppercase; font-family:'SF Mono','Fira Code',monospace; }

            font-size:80px; font-weight:700; letter-spacing:18px;

        .timer .bar {
            display:inline-block; width:200px; height:2px; background:#1c1a16;

            display:block; width:100%; padding:14px; border-radius:2px;
            border:1px solid #c8a45c; font-size:14px; font-weight:600; cursor:pointer;
            transition:all 0.25s; margin-bottom:10px;
            font-family:'SF Mono','Fira Code',monospace; letter-spacing:0.5px;
        }
        .btn.copy {
            background:#c8a45c; color:#1a1808;
        }
        .btn.copy:hover { background:#d4b46e; }
        .btn.copy:active { transform:scale(0.97); }
        .btn.copy.copied { background:#5a7a5a; border-color:#5a7a5a; color:#e4e0d8; }
        .btn.back {
            background:transparent; color:#6b6760; border-color:#1c1a16;
        }
        .btn.back:hover { color:#e4e0d8; border-color:#c8a45c; }
        .hint { font-size:11px; color:#6b6760; margin-top:14px; line-height:1.6; opacity:0.7; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="icon">🔐</div>
    <h1>当前动态密码</h1>
    <p class="sub">5 分钟自动更换 · 本站专用</p>
    <div class="code" id="code">----</div>
    <div class="timer">
        剩余 <span id="remaining">--</span>
        <span class="bar"><span class="fill" id="barFill" style="width:100%"></span></span>
    </div>
    <button class="btn copy" id="copyBtn" onclick="doCopy()">📋 点此复制密码</button>
    <button class="btn back" onclick="window.close();">← 返回</button>
    <p class="hint">复制后切换到视频库页面<br>在密码框中粘贴即可<br><br>⚠️ 本页包含内部密钥，请勿外传</p>
</div>
<script>
// TOTP 算法与服务器端完全一致 (09_lockdown.sql):
//   code = ((win + s1) * P1 + win * s1*P2) % 10000,  win = floor(now/300)
//   s1 = 密钥字符串 ASCII 码之和（此处自动计算，勿写死，防止改种子后不同步）
// 种子已做 XOR+Base64 混淆存放 (与 index.html 的 _vdbDec 同一约定), 防"右键查看源码"直接复制。
// 注意: 纯前端页面无法真正隐藏密钥 —— 浏览器要算出密码就必须能解出它。
// 真正的防线是服务端 verify_passcode 校验。如该种子曾经泄露, 请去 Supabase
// system_config.totp_secret 轮换, 并同步更新此处混淆值。
var _vdbSk=[86,105,100,68,98,75,101,121];
function _vdbDec(b64){var s=atob(b64),o='';for(var i=0;i<s.length;i++)o+=String.fromCharCode(s.charCodeAt(i)^_vdbSk[i%_vdbSk.length]);return o;}
var SEED = _vdbDec('Y10jBjAEJCAEIy4KNgpROA=='); // 已轮换的新种子
var P1 = 7919;
var P2 = 6271;
var STEP = 300;     // 5 分钟

function seedSum(s) {
    var n = 0;
    for (var i = 0; i < s.length; i++) n += s.charCodeAt(i);
    return n;
}

function generateTOTP() {
    var s1 = seedSum(SEED);
    var win = Math.floor(Date.now() / 1000 / STEP);
    var code = ((win + s1) * P1 + win * (s1 * P2)) % 10000;
    return code;
}

var currentCode = '';

function updateTimer() {
    var now = Math.floor(Date.now() / 1000);
    var remaining = STEP - (now % STEP);
    var pct = (remaining / STEP * 100).toFixed(1);
    document.getElementById('remaining').textContent =
        Math.floor(remaining / 60) + '分' + String(remaining % 60).padStart(2,'0') + '秒';
    document.getElementById('barFill').style.width = pct + '%';
}

function refresh() {
    var code = generateTOTP();
    var codeStr = String(code).padStart(4, '0');
    if (codeStr !== currentCode) {
        currentCode = codeStr;
        document.getElementById('code').textContent = currentCode;
        var btn = document.getElementById('copyBtn');
        btn.textContent = '📋 点此复制密码';
        btn.classList.remove('copied');
    }
    updateTimer();
}

function doCopy() {
    if (!currentCode || currentCode === '----') return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentCode).then(function() {
            var btn = document.getElementById('copyBtn');
            btn.textContent = '✓ 已复制: ' + currentCode;
            btn.classList.add('copied');
        }).catch(fallbackCopy);
    } else {
        fallbackCopy();
    }
}

function fallbackCopy() {
    var ta = document.createElement('textarea');
    ta.value = currentCode;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try {
        document.execCommand('copy');
        var btn = document.getElementById('copyBtn');
        btn.textContent = '✓ 已复制: ' + currentCode;
        btn.classList.add('copied');
    } catch(e) {}
    document.body.removeChild(ta);
}

refresh();
setInterval(refresh, 5000);
setInterval(updateTimer, 1000);
</script>
</body>
</html>
