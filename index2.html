<body>
<style>
  [hidden]{display:none !important}
  :root{
    --bg:#0a0a0e; --bg-soft:#101017; --card:#15151d; --card-hi:#1c1c26;
    --line:#262633; --fg:#ededf3; --dim:#9898a8; --dim2:#6c6c7d;
    --accent:#ff2e63; --accent2:#ff7ba0; --ok:#31d68a;
    --radius:14px; --shadow:0 18px 40px -20px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{
    margin:0; background:var(--bg); color:var(--fg); text-align:left;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Hiragino Sans",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(255,46,99,.16), transparent 65%),
      radial-gradient(700px 500px at 92% 0%, rgba(90,120,255,.12), transparent 60%);
  }
  a{color:inherit; text-decoration:none}
  button,input,select{font:inherit; color:inherit}
  ::selection{background:var(--accent); color:#fff}

  /* ---------- header ---------- */
  #topbar{
    position:sticky; top:0; z-index:40;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    background:rgba(10,10,14,.82); border-bottom:1px solid var(--line);
  }
  .bar{
    max-width:1560px; margin:0 auto; padding:10px 16px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; row-gap:8px;
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.02em; font-size:18px; flex:none}
  .brand .dot{
    width:12px; height:12px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#7b5cff);
    box-shadow:0 0 14px rgba(255,46,99,.75);
  }
  .brand small{font-weight:600; font-size:11px; color:var(--dim); letter-spacing:.16em; margin-left:2px}
  .search{flex:1 1 auto; display:flex; align-items:center; gap:8px; max-width:640px;
    background:var(--bg-soft); border:1px solid var(--line); border-radius:999px; padding:6px 6px 6px 14px; transition:border-color .15s, box-shadow .15s}
  .search:focus-within{border-color:rgba(255,46,99,.65); box-shadow:0 0 0 3px rgba(255,46,99,.12)}
  .search input{flex:1; background:none; border:0; outline:none; padding:6px 0; font-size:14px}
  .search input::placeholder{color:var(--dim2)}
  .btn{
    border:1px solid var(--line); background:var(--card); color:var(--fg);
    border-radius:10px; padding:8px 13px; cursor:pointer; font-size:13.5px; font-weight:600;
    transition:background .15s, border-color .15s, transform .12s; white-space:nowrap;
  }
  .btn:hover{background:var(--card-hi); border-color:#333344}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#ff5f8a); border-color:transparent; color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px; font-size:12.5px}
  .icon-btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--card);
    border-radius:10px; padding:8px 11px; cursor:pointer; font-size:13px; font-weight:600; color:var(--dim);
    transition:.15s;
  }
  .icon-btn:hover{color:var(--fg); background:var(--card-hi)}
  .icon-btn.on{color:var(--fg); border-color:rgba(255,46,99,.55); background:rgba(255,46,99,.12)}
  .icon-btn svg{width:16px; height:16px; display:block}
  .actions{display:flex; gap:8px; margin-left:auto; flex:none}

  /* ---------- chips ---------- */
  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:2px 16px 12px; max-width:1560px; margin:0 auto;
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%);
    mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%);
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none; border:1px solid var(--line); background:var(--card); color:var(--dim);
    padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .chip:hover{color:var(--fg); background:var(--card-hi)}
  .chip.on{background:linear-gradient(135deg,var(--accent),#ff5f8a); border-color:transparent; color:#fff}
  .chip .n{font-size:11px; opacity:.7; margin-left:5px; font-weight:700}

  /* ---------- toolbar ---------- */
  main{max-width:1560px; margin:0 auto; padding:16px 16px 90px; position:relative; z-index:1}
  .toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px}
  .toolbar .title{font-size:17px; font-weight:700}
  .toolbar .title em{color:var(--accent2); font-style:normal}
  .toolbar .count{color:var(--dim); font-size:13px; padding-left:12px; border-left:1px solid var(--line)}
  .toolbar .count:empty{border-left:0; padding-left:0}
  .toolbar .spacer{flex:1}
  select.select{
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; cursor:pointer; outline:none;
  }
  #banner{
    display:none; margin:0 0 16px; padding:12px 14px; border-radius:12px; font-size:13.5px;
    background:rgba(255,46,99,.1); border:1px solid rgba(255,46,99,.4); color:#ffc9d7;
  }
  #banner.show{display:block}

  /* ---------- grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:14px;
  }
  @media (max-width:680px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
    .bar{padding:8px 12px; gap:8px}
    .search{order:3; flex:1 1 100%; max-width:none}
    .chips{padding:0 12px 10px}
    main{padding:12px 12px 80px}
    .actions .label{display:none}
    #sortChip .label{display:inline}
    .brand small{display:none}
    .brand{font-size:16px}
    .icon-btn{padding:8px 9px}
    .toolbar{margin-bottom:12px}
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    display:flex; flex-direction:column; transition:transform .16s, border-color .16s, box-shadow .16s;
    content-visibility:auto; contain-intrinsic-size:230px 340px;
  }
  .card:hover{transform:translateY(-3px); border-color:#38384a; box-shadow:var(--shadow)}
  .thumb{position:relative; display:block; aspect-ratio:4/5; background:#0d0d12; overflow:hidden}
  .thumb.dead{background:linear-gradient(135deg,#14141b,#1f1f29)}
  .thumb.dead::after{
    content:"缩略图已失效"; position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; color:#5a5a68; font-size:11.5px; letter-spacing:1.2px; font-weight:600;
  }
  .thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:filter .2s, transform .35s; }
  .card:hover .thumb img{transform:scale(1.04)}
  body.blurOn .thumb img{filter:blur(22px) saturate(1.15)}
  body.blurOn .card:hover .thumb img{filter:none}
  .thumb .veil{position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.72))}
  .thumb .play{
    position:absolute; inset:0; margin:auto; width:44px; height:44px; border-radius:50%;
    background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.28); display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .16s; backdrop-filter:blur(4px);
  }
  .card:hover .play{opacity:1}
  .thumb .tag{
    position:absolute; left:8px; top:8px; background:rgba(0,0,0,.62); border:1px solid rgba(255,255,255,.14);
    padding:3px 7px; border-radius:7px; font-size:10.5px; font-weight:700; letter-spacing:.02em; backdrop-filter:blur(4px);
  }
  .thumb .views{
    position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.62); border:1px solid rgba(255,255,255,.14);
    padding:3px 7px; border-radius:7px; font-size:10.5px; font-weight:700; backdrop-filter:blur(4px);
  }
  .thumb .fav{
    position:absolute; right:8px; top:8px; width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.14); cursor:pointer; opacity:0; transition:.15s; color:#fff;
  }
  .card:hover .thumb .fav{opacity:1}
  .thumb .fav.on{opacity:1; color:var(--accent)}
  .thumb .fav svg{width:15px; height:15px}
  .meta{padding:9px 10px 11px; display:flex; flex-direction:column; gap:6px}
  .meta .t{font-size:13px; line-height:1.38; font-weight:600;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word}
  .meta .sub{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--dim); min-width:0}
  .meta .sub .a{color:var(--accent2); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:58%}
  .meta .sub .a:hover{text-decoration:underline}
  .meta .sub .tags{margin-left:auto; white-space:nowrap; color:var(--dim2)}

  /* ---------- skeleton / loading ---------- */
  .sk{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .sk .b{aspect-ratio:4/5; background:linear-gradient(100deg,#15151d 30%,#20202c 50%,#15151d 70%); background-size:200% 100%; animation:sh 1.25s infinite}
  .sk .l{height:11px; margin:11px 10px; border-radius:6px; background:linear-gradient(100deg,#1a1a24 30%,#24242f 50%,#1a1a24 70%); background-size:200% 100%; animation:sh 1.25s infinite}
  .sk .l.s{width:52%}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  #more{display:flex; justify-content:center; padding:26px 0 10px}
  #sentinel{height:1px}
  .spinner{
    width:20px; height:20px; border-radius:50%; border:2px solid rgba(255,255,255,.18); border-top-color:var(--accent);
    animation:spin .8s linear infinite; display:inline-block; vertical-align:-4px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center; color:var(--dim); padding:70px 10px; font-size:14px}
  .empty b{display:block; font-size:17px; color:var(--fg); margin-bottom:8px}

  /* ---------- player ---------- */
  .overlay{
    position:fixed; inset:0; z-index:80; display:flex; align-items:flex-start; justify-content:center;
    background:rgba(4,4,7,.86); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    padding:3vh 14px; overflow-y:auto; animation:fade .18s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .pbox{
    width:min(1120px,100%); background:#0e0e14; border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:0 40px 80px -30px #000; animation:pop .2s ease;
  }
  @keyframes pop{from{transform:translateY(12px) scale(.99); opacity:0}to{transform:none; opacity:1}}
  .stage{position:relative; background:#000; display:flex; align-items:center; justify-content:center; min-height:200px}
  .stage video{width:100%; max-height:74vh; display:block; background:#000; outline:none}
  .stage .veil{position:absolute; inset:0; pointer-events:none}
  .pclose{
    position:absolute; right:12px; top:12px; z-index:3; width:36px; height:36px; border-radius:10px; cursor:pointer;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .pclose:hover{background:rgba(255,46,99,.85)}
  .perr{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:9px;
    background:rgba(6,6,9,.92); color:var(--dim); text-align:center; padding:14px 16px; font-size:13px; overflow:auto;
  }
  .perr.show{display:flex}
  .vload{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    background:rgba(0,0,0,.42); color:#e8e8ee; font-size:12.5px; font-weight:600; letter-spacing:.4px; pointer-events:none;
  }
  .vload.show{display:flex}
  .vload i{
    width:30px; height:30px; border-radius:50%; display:block;
    border:3px solid rgba(255,255,255,.22); border-top-color:#fff; animation:spin .8s linear infinite;
  }
  .bigplay{
    position:absolute; inset:0; margin:auto; width:74px; height:74px; z-index:2; padding:0 0 0 4px;
    border-radius:50%; border:0; cursor:pointer; background:rgba(255,46,99,.92);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 14px 34px -10px rgba(0,0,0,.85); transition:transform .15s, background .15s;
  }
  .bigplay:hover{background:var(--accent); transform:scale(1.05)}
  .mutehint{
    position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:4; pointer-events:auto; cursor:pointer;
    background:rgba(0,0,0,.68); border:1px solid rgba(255,255,255,.16); color:#fff;
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; white-space:nowrap;
  }
  .bigplay-label{
    position:absolute; left:50%; top:50%; transform:translate(-50%,48px); z-index:2; pointer-events:none;
    background:rgba(0,0,0,.66); border:1px solid rgba(255,255,255,.16); color:#fff;
    font-size:12.5px; font-weight:700; padding:5px 13px; border-radius:999px; white-space:nowrap;
  }
  .perr .errdiag{
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; line-height:1.7; color:var(--dim2);
    max-width:min(560px,90%); word-break:break-all; text-align:left;
  }
  .perr .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
  .pinfo{padding:14px 18px 18px; display:flex; flex-direction:column; gap:12px}
  .pinfo h1{margin:0; font-size:15.5px; line-height:1.5; font-weight:600; word-break:break-word; text-align:left}
  .prow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--dim)}
  .prow .who{color:var(--accent2); font-weight:700; font-size:13px}
  .nav-btn{
    background:var(--card); border:1px solid var(--line); border-radius:50px; padding:6px 12px; cursor:pointer;
    font-size:12.5px; font-weight:600; color:var(--dim);
  }
  .nav-btn:hover{color:var(--fg); background:var(--card-hi)}
  .related h3{margin:4px 0 10px; font-size:14px; font-weight:700}
  .grid.mini{grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); gap:10px}
  .grid.mini .meta .t{font-size:11.5px; -webkit-line-clamp:2}
  .grid.mini .meta .sub{display:none}

  /* ---------- gate ---------- */
  #gate{
    position:fixed; inset:0; z-index:120; display:flex; align-items:center; justify-content:center; padding:20px;
    background:radial-gradient(800px 500px at 50% 0%,rgba(255,46,99,.14),transparent 70%),#08080b;
  }
  .gatebox{width:min(460px,100%); background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px 22px; text-align:center}
  .gatebox .dot{width:14px; height:14px; border-radius:50%; background:linear-gradient(135deg,var(--accent),#7b5cff); margin:0 auto 14px; box-shadow:0 0 18px rgba(255,46,99,.7)}
  .gatebox h2{margin:0 0 8px; font-size:20px}
  .gatebox p{margin:0 0 18px; color:var(--dim); font-size:13.5px; line-height:1.6}
  .gatebox .row{display:flex; gap:10px; justify-content:center; margin-top:14px}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px); z-index:200;
    background:#1b1b25; border:1px solid var(--line); color:var(--fg); padding:10px 16px; border-radius:12px;
    font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.2s; box-shadow:var(--shadow);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #top{
    position:fixed; right:18px; bottom:18px; z-index:60; width:42px; height:42px; border-radius:50%;
    background:var(--card); border:1px solid var(--line); color:var(--fg); display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:0; pointer-events:none; transition:.2s;
  }
  #top.show{opacity:1; pointer-events:auto}
</style>

<header id="topbar">
  <div class="bar">
    <a class="brand" href="#/"><span class="dot"></span>VidBase<small>视频库</small></a>
    <form class="search" id="searchForm" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9898a8" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
      <input id="searchInput" type="search" placeholder="搜索标题关键词，回车确认…" autocomplete="off" spellcheck="false">
      <button class="btn primary sm" type="submit" style="border-radius:999px">搜索</button>
    </form>
    <div class="actions">
      <button class="icon-btn" id="sortChip" title="切换排序（最新 / 最早 / 随机）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 19.5L4.2 16.7M7 19.5l2.8-2.8M17 20V4M17 4.5l-2.8 2.8M17 4.5l2.8 2.8"></path></svg>
        <span class="label" id="sortLabel">最新</span>
      </button>
      <a class="icon-btn" href="#/fav" title="我的收藏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"></path></svg>
        <span class="label">收藏</span>
      </a>
      <a class="icon-btn" href="#/hist" title="观看历史">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5V12l3.2 2"></path></svg>
        <span class="label">历史</span>
      </a>
      <button class="icon-btn" id="blurBtn" title="模糊 / 取消模糊缩略图">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.8"></circle><path d="M4 20L20 4"></path></svg>
      </button>
    </div>
  </div>
  <nav class="chips" id="chips"></nav>
</header>

<main>
  <div class="toolbar">
    <div class="title" id="viewTitle">全部视频</div>
    <div class="count" id="viewCount"></div>
    <div class="spacer"></div>
    <button class="btn sm ghost" id="clearBtn" hidden>清空全部</button>
  </div>
  <div id="banner"></div>
  <div class="grid" id="grid"></div>
  <div id="moreWrap" hidden><div id="more"><button class="btn" id="moreBtn">加载更多</button></div></div>
  <div id="sentinel"></div>
</main>

<div class="overlay" id="player" hidden>
  <div class="pbox" role="dialog" aria-modal="true">
    <div class="stage">
      <button class="pclose" id="pClose" title="关闭 (Esc)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <video id="videoEl" controls playsinline preload="auto" referrerpolicy="no-referrer"></video>
      <button class="bigplay" id="bigPlay" type="button" title="播放" hidden>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l11-6.5z"></path></svg>
      </button>
      <div class="bigplay-label" id="bigPlayLabel" hidden>点击播放</div>
      <div class="mutehint" id="muteHint" hidden>🔇 已静音播放 · 点这里开启声音</div>
      <div class="vload" id="vLoad"><i></i><span id="vLoadTxt">正在缓冲…</span></div>

    <h2>成人内容警告</h2>
    <p>本站为数据库内容浏览器，所有内容来自第三方采集数据，可能包含成人向素材。请确认你已年满 18 岁，并自愿继续浏览。</p>
    <div class="row">

<button id="top" title="回到顶部">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
</button>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var R = (typeof root !== "undefined" && root) ? root : window;
  var cfg = {
    url: String(R.supabaseUrl || "").replace(/\/+$/, ""),
    key: String(R.supabaseAnonKey || ""),
    table: String(R.videoTable || "videos"),
    pageSize: Number(R.pageSize) || 48,
    ageGate: R.ageGate !== false
  };

  var SELECT = "select=id,title,thumbnail_url,video_url,mp4_url,author,views,source_section,created_at,monsnode_video_id";

  var SECTIONS = [
    {key:"", label:"全部"},
    {key:"latest", label:"最新"},
    {key:"24h", label:"24 小时"},
    {key:"3d", label:"3 天"},
    {key:"7d", label:"7 天"},
    {key:"30d", label:"30 天"},
    {key:"ranking", label:"排行榜"},
    {key:"trending", label:"热门"},
    {key:"home", label:"首页"}
  ];
  var SORTS = [{key:"newest",label:"最新"},{key:"oldest",label:"最早"},{key:"random",label:"随机"}];
  var SECTION_LABEL = {latest:"最新", "24h":"24小时", "3d":"3天", "7d":"7天", "30d":"30天", ranking:"排行榜", trending:"热门", home:"首页", search:"搜索"};

  var state = {
    kind:"browse", section:"", q:"", author:"",
    sort:"newest", items:[], offset:0, total:0,
    loading:false, done:false, pendingReset:false, listHash:"#/", playerId:null, hls:null, videoToken:0, videoRetry:false, blobUrl:null,
    playlist:[], relatedItems:[],
    curItem:null, srcUrl:"", mutedByAuto:false, route:"", diag:[]
  };
  var settings = {ageOk:false, blur:false, sort:"newest"};

  var $ = function(id){ return document.getElementById(id); };
  var gridEl = $("grid"), sentinel = $("sentinel");
  var toastTimer = null;

  /* ============ tiny helpers ============ */
  function esc(s){ return String(s == null ? "" : s); }
  function fmtNum(n){ return (Number(n)||0).toLocaleString("zh-CN"); }
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }
  var decTa = document.createElement("textarea");
  function decodeEntities(s){
    decTa.innerHTML = s;
    return decTa.value;
  }
  function cleanTitle(t, fallbackId){
    var s = decodeEntities(esc(t).replace(/\r/g, " "))
      .replace(/https?:\/\/(?:t\.co|twitter\.com|x\.com)\/\S+/gi, " ");
    s = s.replace(/[ \t\u3000]+/g, " ").replace(/\n{2,}/g, "\n").trim();
    if(!s) s = "未命名视频 · " + (fallbackId || "");
    return s;
  }
  function shortTitle(t){
    var s = cleanTitle(t, "");
    return s.length > 90 ? s.slice(0, 88) + "…" : s;
  }
  function sectionTags(str){
    if(!str) return [];
    var out = [], seen = {};
    str.split("|").forEach(function(s){
      s = s.trim();
      if(!s || seen[s] || !SECTION_LABEL[s] || s === "search") return;
      seen[s] = 1; out.push(s);
    });
    return out.slice(0, 2).map(function(s){ return SECTION_LABEL[s]; });
  }
  function thumbSmall(u){
    return thumbCandidates(u)[0];
  }
  function thumbCandidates(u){
    u = esc(u);
    if(!u) return [""];
    var out = [];
    if(/^https:\/\/pbs\.twimg\.com\//.test(u)){
      if(u.indexOf("?") === -1){
        out.push(u + "?name=small", u + "?name=medium", u);
      } else {
        out.push(u);
        if(/name=small/.test(u)) out.push(u.replace(/name=small/, "name=medium"));
        out.push(u.replace(/\?.*$/, ""));
      }
    } else {
      out.push(u);
      out.push(u.replace(/\?.*$/, ""));
    }
    return out.filter(function(x, i){ return x && out.indexOf(x) === i; });
  }
  function viewCount(v){
    if(v == null) return 0;
    var s = String(v).trim();
    if(!/^\d+$/.test(s)) return 0;
    return parseInt(s, 10) || 0;
  }
  function fmtViews(n){
    if(n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,"") + "亿";
    if(n >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,"") + "万";
    return String(n);
  }
  function val(v){
    return encodeURIComponent(String(v == null ? "" : v));
  }
  function encodeQS(o){
    return Object.keys(o).map(function(k){ return k + "=" + encodeURIComponent(o[k]); }).join("&");
  }

  /* ============ local storage (kv-plugin, with in-memory fallback) ============ */
  var mem = {};
  var store = {
    get: function(folder, key, dflt){
      return Promise.resolve()
        .then(function(){ return (R.kv && R.kv[folder]) ? R.kv[folder].get(key) : Promise.reject(new Error("no kv")); })
        .then(function(v){ return (v === undefined || v === null) ? dflt : v; })
        .catch(function(){ var v = mem[folder + "/" + key]; return (v === undefined || v === null) ? dflt : v; });
    },
    set: function(folder, key, val){
      mem[folder + "/" + key] = val;
      try { if(R.kv && R.kv[folder]) return Promise.resolve(R.kv[folder].set(key, val)).catch(function(){}); } catch(e){}
      return Promise.resolve();
    },
    del: function(folder, key){
      delete mem[folder + "/" + key];
      try { if(R.kv && R.kv[folder]) return Promise.resolve(R.kv[folder].delete(key)).catch(function(){}); } catch(e){}
      return Promise.resolve();
    },
    entries: function(folder){
      return Promise.resolve()
        .then(function(){
          if(!R.kv || !R.kv[folder]) throw new Error("no kv");
          return R.kv[folder].entries();
        })
        .then(function(e){
          if(!e) return [];
          if(Array.isArray(e)){
            return e.map(function(x){ return Array.isArray(x) ? {key:x[0], value:x[1]} : {key:x && x.key, value:x && x.value}; });
          }
          return Object.keys(e).map(function(k){ return {key:k, value:e[k]}; });
        })
        .catch(function(){
          return Object.keys(mem).filter(function(k){ return k.indexOf(folder + "/") === 0; })
            .map(function(k){ return {key:k.slice(folder.length + 1), value:mem[k]}; });
        });
    }
  };
  function saveSettings(){ store.set("settings", "ui", JSON.parse(JSON.stringify(settings))); }

  /* ============ supabase REST ============ */
  function sbUrl(qs){ return cfg.url + "/rest/v1/" + cfg.table + "?" + qs; }
  function sbHeaders(extra){
    var h = {apikey:cfg.key, Authorization:"Bearer " + cfg.key, Accept:"application/json"};
    if(extra) for(var k in extra) h[k] = extra[k];
    return h;
  }
  function sbGet(qs, opts){
    opts = opts || {};
    var headers = sbHeaders(opts.count ? {Prefer:"count=exact"} : null);
    if(opts.range) headers.Range = opts.range[0] + "-" + opts.range[1];
    return fetch(sbUrl(qs), {headers:headers}).then(function(res){
      if(res.status === 416) return {data:[], total:null, stop:true};
      if(!res.ok){
        return res.text().then(function(t){
          var msg = t;
          try { msg = JSON.parse(t).message || t; } catch(e){}
          var err = new Error("数据库请求失败 (" + res.status + ")： " + msg);
          err.status = res.status;
          throw err;
        });
      }
      var cr = res.headers.get("content-range");
      var total = (cr && cr.indexOf("/") > -1) ? Number(cr.split("/")[1]) : null;
      return res.json().then(function(data){
        return {data:data, total:(isNaN(total) ? null : total)};
      });
    });
  }
  function filters(){
    var f = ["removed=eq.false"];
    if(state.section) f.push("source_section=like.*" + state.section + "*");
    if(state.q) f.push("title=ilike.*" + val(state.q.replace(/\*/g, "")) + "*");
    if(state.author) f.push("author=eq." + val(state.author));
    return f;
  }
  function listQuery(limit, offset){
    var q = SELECT + "&" + filters().join("&");
    if(state.sort === "oldest") q += "&order=id.asc";
    else q += "&order=id.desc";
    return q + "&offset=" + offset + "&limit=" + limit;
  }
  function randOff(total){
    return Math.floor(Math.random() * Math.max(1, total - cfg.pageSize + 1));
  }
  function countFor(f){
    return sbGet("select=id&" + f.join("&") + "&limit=1", {count:true}).then(function(res){
      return res.total || 0;
    });
  }
  function randomSeed(f){
    if(state.total > 0) return Promise.resolve(randOff(state.total));
    return countFor(f).then(function(n){ return randOff(n); });
  }
  function banner(msg){
    var b = $("banner");
    if(!msg){ b.classList.remove("show"); b.textContent = ""; return; }
    b.textContent = msg; b.classList.add("show");
  }

  /* ============ rendering ============ */
  var HEART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"></path></svg>';
  var PLAY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l11-6.5z"></path></svg>';

  function makeCard(it){
    var card = document.createElement("article");
    card.className = "card";
    card.dataset.id = it.id;

    var a = document.createElement("a");
    a.className = "thumb";
    a.href = "#/v/" + it.id;

    var img = document.createElement("img");
    img.loading = "lazy"; img.decoding = "async"; img.referrerPolicy = "no-referrer"; img.alt = "";
    var cands = thumbCandidates(it.thumbnail_url), ti = 0;
    img.src = cands[0] || "";
    img.onerror = function(){
      ti++;
      if(ti < cands.length){ img.src = cands[ti]; return; }
      img.onerror = null;
      img.removeAttribute("src");
      a.classList.add("dead");
    };
    a.appendChild(img);

    var veil = document.createElement("span"); veil.className = "veil"; a.appendChild(veil);

    var tags = sectionTags(it.source_section);
    if(tags.length){
      var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = tags[0];
      a.appendChild(tag);
    }
    var vc = viewCount(it.views);
    if(vc > 0){
      var v = document.createElement("span"); v.className = "views"; v.textContent = fmtViews(vc); a.appendChild(v);
    }
    var play = document.createElement("span"); play.className = "play"; play.innerHTML = PLAY; a.appendChild(play);

    var fav = document.createElement("button");
    fav.className = "fav"; fav.type = "button"; fav.title = "收藏"; fav.innerHTML = HEART;
    fav.addEventListener("click", function(ev){
      ev.preventDefault(); ev.stopPropagation();
      toggleFav(it, fav);
    });
    a.appendChild(fav);

    var meta = document.createElement("div"); meta.className = "meta";
    var t = document.createElement("div"); t.className = "t"; t.textContent = cleanTitle(it.title, it.monsnode_video_id);
    var sub = document.createElement("div"); sub.className = "sub";
    if(it.author){
      var au = document.createElement("a"); au.className = "a"; au.href = "#/a/" + encodeURIComponent(it.author);
      au.textContent = "@" + it.author; sub.appendChild(au);
    } else {
      var an = document.createElement("span"); an.className = "a"; an.textContent = "匿名"; sub.appendChild(an);
    }
    var tg = document.createElement("span"); tg.className = "tags";
    tg.textContent = tags.length > 1 ? tags.join(" · ") : "";
    sub.appendChild(tg);
    meta.appendChild(t); meta.appendChild(sub);
    card.appendChild(a); card.appendChild(meta);
    return card;
  }

  var favCache = {};
  function toggleFav(it, btn){
    var key = String(it.id);
    if(favCache[key]){
      delete favCache[key];
      store.del("favs", key);
      if(btn) btn.classList.remove("on");
      toast("已取消收藏");
      if(state.kind === "fav") renderLocal("fav");
    } else {
      var rec = slim(it); rec.ts = Date.now();
      favCache[key] = rec;
      store.set("favs", key, rec);
      if(btn) btn.classList.add("on");
      toast("已加入收藏");
    }
  }
  function slim(it){
    return {
      id:it.id, title:it.title, thumbnail_url:it.thumbnail_url, video_url:it.video_url,
      mp4_url:it.mp4_url, author:it.author, views:it.views,
      source_section:it.source_section, monsnode_video_id:it.monsnode_video_id
    };
  }

  function skeletons(n){
    var frag = document.createDocumentFragment();
    for(var i = 0; i < n; i++){
      var d = document.createElement("div"); d.className = "sk";
      d.innerHTML = '<div class="b"></div><div class="l"></div><div class="l s"></div>';
      frag.appendChild(d);
    }
    gridEl.appendChild(frag);
  }
  function renderCards(items, append){
    if(!append) gridEl.textContent = "";
    var frag = document.createDocumentFragment();
    items.forEach(function(it){
      var c = makeCard(it);
      if(favCache[String(it.id)]) c.querySelector(".fav").classList.add("on");
      frag.appendChild(c);
    });
    gridEl.appendChild(frag);
  }

  /* ============ browse ============ */
  function setToolbar(){
    var titles = {browse:"全部视频", section:"分区 · ", search:"搜索：", author:"作者：", fav:"我的收藏", hist:"观看历史"};
    if(state.kind === "browse"){
      var s = SECTIONS.filter(function(x){ return x.key === state.section; })[0];
      $("viewTitle").textContent = state.section ? ("分区 · " + (s ? s.label : state.section)) : "全部视频";
    } else if(state.kind === "search"){
      $("viewTitle").innerHTML = "";
      $("viewTitle").appendChild(document.createTextNode("搜索："));
      var em = document.createElement("em"); em.textContent = state.q; $("viewTitle").appendChild(em);
    } else if(state.kind === "author"){
      $("viewTitle").innerHTML = "";
      $("viewTitle").appendChild(document.createTextNode("作者："));
      var em2 = document.createElement("em"); em2.textContent = "@" + state.author; $("viewTitle").appendChild(em2);
    } else if(state.kind === "fav"){
      $("viewTitle").textContent = "我的收藏";
    } else if(state.kind === "hist"){
      $("viewTitle").textContent = "观看历史";
    }
    $("viewCount").textContent = (state.kind === "fav" || state.kind === "hist")
      ? (state.items.length ? "共 " + state.items.length + " 个" : "")
      : (state.total ? "共 " + fmtNum(state.total) + " 个视频" : "");
    $("sortChip").hidden = (state.kind === "fav" || state.kind === "hist");
    $("sortLabel").textContent = (SORTS.filter(function(s){ return s.key === state.sort; })[0] || {label:"最新"}).label;
    $("clearBtn").hidden = !(state.kind === "fav" || state.kind === "hist");
  }
  function setChips(){
    var wrap = $("chips");
    wrap.textContent = "";
    SECTIONS.forEach(function(s){
      var b = document.createElement("button");
      b.className = "chip" + (state.kind === "browse" && state.section === s.key ? " on" : "");
      b.type = "button"; b.textContent = s.label;
      b.addEventListener("click", function(){ location.hash = s.key ? ("#/s/" + s.key) : "#/"; });
      wrap.appendChild(b);
    });
  }

  function resetList(){
    state.items = []; state.offset = 0; state.done = false; state.total = 0;
    gridEl.textContent = ""; banner("");
    $("moreWrap").hidden = true;
  }

  function applyResult(res, reset){
    if(state.pendingReset) return;
    if(res.stop){ state.done = true; $("moreWrap").hidden = state.sort !== "random"; return; }
    if(res.total != null) state.total = res.total;
    var seen = {};
    state.items.forEach(function(x){ seen[x.id] = 1; });
    var fresh = res.data.filter(function(d){ return !seen[d.id]; });
    renderCards(fresh, !reset);
    state.items = state.items.concat(fresh);
    state.offset = reset ? res.data.length : (state.offset + res.data.length);
    if(res.data.length < cfg.pageSize) state.done = true;
    if(state.sort === "random") state.done = true;
    if(state.items.length === 0){
      var e = document.createElement("div"); e.className = "empty";
      var b = document.createElement("b"); b.textContent = "没有找到匹配的视频";
      e.appendChild(b);
      e.appendChild(document.createTextNode("换个关键词，或切换到其他分区试试。"));
      gridEl.appendChild(e);
    }
    $("moreWrap").hidden = state.done && state.sort !== "random";
    $("moreBtn").textContent = state.sort === "random" ? "换一批（随机）" : "加载更多";
    setToolbar();
  }

  function runLoad(reset){
    var f = filters();
    var wantCount = state.total === 0 || !!reset;
    var seedP = (reset && state.sort === "random") ? randomSeed(f) : Promise.resolve(0);
    if(reset) skeletons(Math.min(12, cfg.pageSize));
    return seedP.then(function(seed){
      if(state.pendingReset) return;
      var off = (reset && state.sort === "random") ? seed : state.offset;
      return sbGet(listQuery(cfg.pageSize, off), {count:wantCount}).then(function(res){
        applyResult(res, reset);
      });
    });
  }

  function loadPage(reset){
    if(reset) state.pendingReset = true;
    if(state.loading) return Promise.resolve();
    if(state.pendingReset){ state.pendingReset = false; reset = true; }
    if(!reset){
      if(state.done) return Promise.resolve();
      if(state.total > 0 && state.offset >= state.total){
        state.done = true;
        $("moreWrap").hidden = state.sort !== "random";
        return Promise.resolve();
      }
    }
    state.loading = true;
    if(reset){ resetList(); }
    return runLoad(reset).catch(function(err){
      if(state.pendingReset) return;
      banner(esc(err && err.message ? err.message : err));
      if(reset) gridEl.textContent = "";
    }).then(function(){
      state.loading = false;
      if(state.pendingReset) loadPage(true);
    });
  }

  /* ============ local lists (favorites / history) ============ */
  function renderLocal(kind){
    state.kind = kind; state.playerId = null;
    resetList();
    setChips(); setToolbar();
    store.entries(kind === "fav" ? "favs" : "hist").then(function(list){
      var items = list.map(function(x){ return x.value; }).filter(Boolean)
        .sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
      state.items = items;
      if(!items.length){
        var e = document.createElement("div"); e.className = "empty";
        var b = document.createElement("b");
        b.textContent = kind === "fav" ? "还没有收藏" : "还没有观看记录";
        e.appendChild(b);
        e.appendChild(document.createTextNode(kind === "fav" ? "点击视频缩略图右上角的爱心即可收藏。" : "播放过的视频会自动出现在这里。"));
        gridEl.appendChild(e);
      } else {
        renderCards(items, false);
      }
      $("moreWrap").hidden = true;
      setToolbar();
    });
  }
  function pushHistory(it){
    var rec = slim(it); rec.ts = Date.now();
    store.set("hist", String(it.id), rec);
    store.entries("hist").then(function(list){
      if(list.length <= 400) return;
      list.sort(function(a, b){ return (a.value && a.value.ts || 0) - (b.value && b.value.ts || 0); });
      list.slice(0, list.length - 400).forEach(function(x){ store.del("hist", x.key); });
    });
  }

  /* ============ player ============ */
  function findItem(id){
    var pools = [state.items, state.relatedItems];
    for(var p = 0; p < pools.length; p++){
      for(var i = 0; i < pools[p].length; i++) if(String(pools[p][i].id) === String(id)) return pools[p][i];
    }
    return null;
  }
  function buildPlaylist(item){
    for(var i = 0; i < state.items.length; i++){
      if(String(state.items[i].id) === String(item.id)){ state.playlist = state.items; return; }
    }
    for(var j = 0; j < state.relatedItems.length; j++){
      if(String(state.relatedItems[j].id) === String(item.id)){
        var arr = state.relatedItems.slice();
        arr.sort(function(a, b){ return (Number(b.id) || 0) - (Number(a.id) || 0); });
        state.playlist = arr;
        return;
      }
    }
    state.playlist = [item];
  }
  function vLoadShow(on, txt){
    var el = $("vLoad");
    if(txt != null) $("vLoadTxt").textContent = txt;
    el.classList.toggle("show", !!on);
  }
  function revokeBlob(){

  function hlsStep(v, url, token, steps, i){

      showErr("HLS 播放失败：该视频源可能已被删除，或 CDN 拒绝了本次请求。");
      return;

    var next = function(){ hlsStep(v, url, token, steps, i + 1); };

      return;

    diag("HLS（hls.js）：开始");
    vLoadShow(true, "正在缓冲…");

  function attachVideo(it){

    state.advance = null;
    state.curItem = it;
    hideErr();
    state.videoToken = (state.videoToken || 0) + 1;
    var token = state.videoToken;
    setMuted(v, false);
    v.pause(); v.removeAttribute("src"); v.load();

      diag("数据库里这条记录没有 mp4_url");

  function playFile(v, url, token, attempt, noBlob, onFail){
    state.videoRetry = true;

    var target = url;
    if(attempt === 1){
      // 直连重试：加时间戳绕开偶发的缓存/一次性失败
      target = url + (url.indexOf("?") === -1 ? "?" : "&") + "_r=" + Date.now();
    }
    vLoadShow(true, attempt === 0 ? "正在缓冲…" : "正在重试直连…");
    diag(lbl + (attempt ? "重试" : "") + "：开始");
    var advanced = false;
    var advance = function(why){
      if(advanced || token !== state.videoToken) return;
      advanced = true;
      diag(lbl + (attempt ? "重试" : "") + "失败" + (why ? "（" + why + "）" : ""));
      if(attempt < 1) playFile(v, url, token, attempt + 1, noBlob, onFail);
      else if(noBlob){
        state.videoRetry = false;
        state.advance = null;
        if(onFail) onFail(); else showErr();

  function blobFallback(v, url, token, attempt){

    vLoadShow(true, label);
    diag(attempt === 0 ? "直接下载：开始" : ("中转线路 " + attempt + "：开始"));
    var done = false;
    var ac = new AbortController();
    var to = setTimeout(function(){
      if(done || token !== state.videoToken) return;
      done = true;
      try { ac.abort(); } catch(e){}
      diag(attempt === 0 ? "直接下载：超时" : ("中转线路 " + attempt + "：超时"));
      next();
    }, attempt === 0 ? 20000 : 12000);
    function next(){
      if(token !== state.videoToken) return;
      if(attempt < PROXY_LIST.length) blobFallback(v, url, token, attempt + 1);

      done = true; clearTimeout(to);
      diag((attempt === 0 ? "直接下载" : "中转线路 " + attempt) + "：成功 " + Math.round(b.size / 1024) + "KB");

  /* ============ router ============ */
  function parseHash(){
    var h = location.hash.replace(/^#\/?/, "");
    var parts = h.split("/").map(function(p){ try { return decodeURIComponent(p); } catch(e){ return p; } });
    if(parts[0] === "v" && parts[1]) return {name:"video", id:parts[1]};
    if(parts[0] === "s") return {name:"section", section:parts[1] || ""};
    if(parts[0] === "q") return {name:"search", q:parts.slice(1).join("/")};
    if(parts[0] === "a") return {name:"author", author:parts.slice(1).join("/")};
    if(parts[0] === "fav") return {name:"fav"};
    if(parts[0] === "hist") return {name:"hist"};

  function route(){
    var r = parseHash();

    }
    if(!$("player").hidden) closePlayer(false);

    if(r.name === "fav" || r.name === "hist"){
      state.listHash = location.hash;
      renderLocal(r.name);
      return;
    }
    var changed = false;
    if(r.name === "home" || r.name === "section"){
      changed = !(state.kind === "browse" && state.section === (r.section || "") && state.total !== 0);
      state.kind = "browse"; state.section = r.section || ""; state.q = ""; state.author = "";

  store.get("settings", "ui", null).then(function(s){
    if(s && typeof s === "object"){
      settings.ageOk = !!s.ageOk;
      settings.blur = !!s.blur;
      if(s.sort) settings.sort = s.sort;
    }
    if(!location.hash) location.hash = "#/";
    boot();
  });
})();
</script>
