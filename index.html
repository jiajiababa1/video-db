<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>2048 - 在线小游戏</title>
    <style>
        :root {
            --bg: #faf8ef;
            --text: #776e65;
            --board-bg: #bbada0;
            --cell-empty: #cdc1b4;
            --accent: #f65e3b;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
            transition: background 0.3s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ===== 游戏视图 ===== */
        .game-container {
            max-width: 500px; margin: 0 auto; padding: 20px; text-align: center;
        }
        .game-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .game-title {
            font-size: 64px; font-weight: 700; color: var(--accent); cursor: default;
            transition: color 0.3s;
        }
        .game-title.trigger-hint { animation: pulse 0.5s; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
        .scores { display: flex; gap: 10px; }
        .score-box {
            background: var(--board-bg); color: #fff; padding: 10px 20px; border-radius: 6px;
            font-size: 12px; text-align: center;
        }
        .score-box .val { font-size: 24px; font-weight: 700; display: block; }
        .new-game-btn {
            background: #8f7a66; color: #fff; border: none; padding: 12px 24px;
            border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600;
        }
        .new-game-btn:hover { background: #9f8b77; }
        .board {
            position: relative; background: var(--board-bg); border-radius: 8px;
            padding: 10px; display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 10px; margin: 20px auto; max-width: 420px; aspect-ratio: 1;
        }
        .cell {
            background: var(--cell-empty); border-radius: 6px; display: flex;
            align-items: center; justify-content: center; font-size: 28px;
            font-weight: 700; transition: all 0.1s;
        }
        .cell-2    { background:#eee4da; color:#776e65; }
        .cell-4    { background:#ede0c8; color:#776e65; }
        .cell-8    { background:#f2b179; color:#f9f6f2; }
        .cell-16   { background:#f59563; color:#f9f6f2; }
        .cell-32   { background:#f67c5f; color:#f9f6f2; }
        .cell-64   { background:#f65e3b; color:#f9f6f2; }
        .cell-128  { background:#edcf72; color:#f9f6f2; font-size:24px; }
        .cell-256  { background:#edcc61; color:#f9f6f2; font-size:24px; }
        .cell-512  { background:#edc850; color:#f9f6f2; font-size:24px; }
        .cell-1024 { background:#edc53f; color:#f9f6f2; font-size:20px; }
        .cell-2048 { background:#edc22e; color:#f9f6f2; font-size:20px; }
        .cell-super { background:#3c3a32; color:#f9f6f2; font-size:18px; }
        .game-over-overlay {
            position: absolute; top:0; left:0; right:0; bottom:0;
            background: rgba(238,228,218,0.73); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; font-weight: 700; color: #776e65; z-index: 10;
        }
        .hidden { display: none !important; }

        /* ===== 视频视图 (隐藏) ===== */
        :root.dark {
            --bg: #0f0f11; --text: #e4e4e7; --board-bg: #27272a; --cell-empty: #1a1a1f; --accent: #6366f1;
        }
        :root.dark .game-container { display: none; }
        :root.dark .video-app { display: block; }

        .video-app { display: none; }
        .video-header {
            position: sticky; top: 0; z-index: 100; background: var(--bg);
            border-bottom: 1px solid #27272a; padding: 12px 20px;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .video-logo { font-size: 18px; font-weight: 700; color: var(--text); text-decoration: none; white-space: nowrap; cursor: default; }
        .video-logo span { color: var(--accent); }
        .back-btn {
            padding: 6px 14px; border-radius: 6px; border: 1px solid #404040;
            background: #1a1a1f; color: var(--text); cursor: pointer; font-size: 12px;
        }
        .back-btn:hover { background:#2a2a2f; }
        .search-box { flex: 1; min-width: 150px; max-width: 400px; position: relative; }
        .search-box input {
            width: 100%; padding: 8px 14px 8px 36px; border-radius: 999px;
            border: 1px solid #333; background: #1a1a1f; color: var(--text);
            font-size: 13px; outline: none;
        }
        .search-box input:focus { border-color: var(--accent); }
        .search-box input::placeholder { color: #71717a; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #71717a; font-size: 14px; pointer-events: none; }
        .header-stats { color: #a1a1aa; font-size: 12px; white-space: nowrap; }
        .refresh-btn {
            padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent);
            background: var(--accent); color: #fff; cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .refresh-btn:hover { background: #818cf8; }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .video-container { max-width: 1400px; margin: 0 auto; padding: 16px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .video-card {
            background: #1a1a1f; border-radius: 10px; overflow: hidden; border: 1px solid #27272a;
            cursor: pointer; display: flex; flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }
        .video-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .thumb-wrap { position: relative; width: 100%; padding-top: 56.25%; background: #18181b; overflow: hidden; }
        .thumb-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .no-thumb {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #27272a; color: #71717a; font-size: 13px;
        }
        .video-info { padding: 10px 14px; flex: 1; }
        .video-title {
            font-size: 13px; font-weight: 500; color: #e4e4e7;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; line-height: 1.4; min-height: 36px;
        }
        .video-meta { display: flex; gap: 10px; font-size: 11px; color: #71717a; margin-top: 8px; }
        .video-id { font-family: monospace; opacity: 0.6; }

        .loading-wrap { text-align: center; padding: 40px; color: #71717a; }
        .spinner {
            width: 32px; height: 32px; border: 3px solid #333;
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { text-align: center; padding: 40px; color: #f87171; }
        .empty-state { text-align: center; padding: 60px; color: #71717a; }

        .load-more-wrap { text-align: center; margin-top: 24px; padding-bottom: 30px; }
        .load-more-btn {
            padding: 10px 36px; border-radius: 999px; border: 1px solid #333;
            background: #1a1a1f; color: #e4e4e7; font-size: 13px; cursor: pointer;
        }
        .load-more-btn:hover { border-color: var(--accent); }
        .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 24px; border-radius: 8px;
            font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }

        @media (max-width: 640px) {
            .game-container { padding: 10px; }
            .game-title { font-size: 40px; }
            .board { max-width: 320px; gap: 6px; padding: 6px; }
            .cell { font-size: 22px; }
            .video-header { padding: 10px 12px; gap: 8px; }
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            .video-title { font-size: 11px; min-height: 28px; }
            .cell-128,.cell-256,.cell-512 { font-size:18px; }
            .cell-1024,.cell-2048,.cell-super { font-size:14px; }
        }
    </style>
</head>
<body>

    <!-- ==================== 游戏伪装页面 ==================== -->
    <div class="game-container" id="gameView">
        <div class="game-header">
            <div class="game-title" id="gameTitle" title="2048">2048</div>
            <div class="scores">
                <div class="score-box">
                    分数 <span class="val" id="gameScore">0</span>
                </div>
                <div class="score-box">
                    最高 <span class="val" id="gameBest">0</span>
                </div>
            </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <p style="font-size:15px;color:#776e65;">用方向键合并相同数字，达到 <b>2048</b> 即可胜出！</p>
            <button class="new-game-btn" onclick="newGame()">新游戏</button>
        </div>
        <div class="board" id="board"></div>
        <p style="color:#bbada0;font-size:12px;margin-top:16px;">键盘方向键操作 ｜ 手机滑动操作</p>
    </div>

    <!-- ==================== 视频数据库 (隐藏) ==================== -->
    <div class="video-app" id="videoView">
        <div class="video-header">
            <a class="video-logo">Video<span>DB</span></a>
            <button class="back-btn" onclick="goBackToGame()">返回游戏</button>
            <div class="search-box">
                <span class="search-icon">&#128269;</span>
                <input type="text" id="searchInput" placeholder="搜索视频..." autocomplete="off">
            </div>
            <span class="header-stats" id="headerStats">加载中...</span>
            <button class="refresh-btn" id="refreshBtn" title="刷新数据并触发爬虫">更新数据</button>
        </div>
        <div class="video-container">
            <div class="video-grid" id="videoGrid">
                <div class="loading-wrap" style="grid-column:1/-1;"><div class="spinner"></div><p>加载中...</p></div>
            </div>
            <div class="load-more-wrap" style="display:none;">
                <button class="load-more-btn" id="loadMoreBtn">加载更多</button>
            </div>
        </div>
        <div class="toast" id="toast"></div>
    </div>

    <script>
    // ============================================================
    // 2048 游戏
    // ============================================================
    var gameState = { grid: [], score: 0, best: 0, over: false, won: false };
    var boardEl = document.getElementById('board');
    var scoreEl = document.getElementById('gameScore');
    var bestEl = document.getElementById('gameBest');

    function initGame() {
        gameState.grid = Array(4).fill().map(function() { return Array(4).fill(0); });
        gameState.score = 0;
        gameState.over = false;
        gameState.won = false;
        gameState.best = parseInt(localStorage.getItem('best2048') || '0');
        bestEl.textContent = gameState.best;
        addRandom(); addRandom();
        renderBoard();
    }

    function addRandom() {
        var empty = [];
        for (var r = 0; r < 4; r++)
            for (var c = 0; c < 4; c++)
                if (gameState.grid[r][c] === 0) empty.push({r:r, c:c});
        if (empty.length === 0) return;
        var pos = empty[Math.floor(Math.random() * empty.length)];
        gameState.grid[pos.r][pos.c] = Math.random() < 0.9 ? 2 : 4;
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        for (var r = 0; r < 4; r++) {
            for (var c = 0; c < 4; c++) {
                var cell = document.createElement('div');
                cell.className = 'cell';
                var val = gameState.grid[r][c];
                if (val > 0) {
                    cell.textContent = val;
                    cell.classList.add(val <= 2048 ? 'cell-' + val : 'cell-super');
                }
                boardEl.appendChild(cell);
            }
        }
        scoreEl.textContent = gameState.score;
        if (gameState.score > gameState.best) {
            gameState.best = gameState.score;
            localStorage.setItem('best2048', gameState.best);
            bestEl.textContent = gameState.best;
        }
        if (gameState.over) {
            var overlay = document.createElement('div');
            overlay.className = 'game-over-overlay';
            overlay.textContent = gameState.won ? '你赢了！' : '游戏结束';
            boardEl.appendChild(overlay);
        }
    }

    function slide(row) {
        var arr = row.filter(function(v) { return v !== 0; });
        for (var i = 0; i < arr.length - 1; i++) {
            if (arr[i] === arr[i+1]) { arr[i] *= 2; gameState.score += arr[i]; arr.splice(i+1, 1); if (arr[i] === 2048) gameState.won = true; }
        }
        while (arr.length < 4) arr.push(0);
        return arr;
    }

    function move(dir) {
        if (gameState.over) return;
        var old = JSON.stringify(gameState.grid);
        var g = gameState.grid;
        if (dir === 'left')
            for (var r = 0; r < 4; r++) g[r] = slide(g[r]);
        else if (dir === 'right')
            for (var r = 0; r < 4; r++) { g[r].reverse(); g[r] = slide(g[r]); g[r].reverse(); }
        else if (dir === 'up')
            for (var c = 0; c < 4; c++) {
                var col = [g[0][c], g[1][c], g[2][c], g[3][c]];
                col = slide(col);
                for (var r = 0; r < 4; r++) g[r][c] = col[r];
            }
        else if (dir === 'down')
            for (var c = 0; c < 4; c++) {
                var col = [g[0][c], g[1][c], g[2][c], g[3][c]];
                col.reverse(); col = slide(col); col.reverse();
                for (var r = 0; r < 4; r++) g[r][c] = col[r];
            }
        if (JSON.stringify(g) !== old) {
            addRandom(); renderBoard();
            if (isGameOver()) { gameState.over = true; renderBoard(); }
        }
    }

    function isGameOver() {
        for (var r = 0; r < 4; r++)
            for (var c = 0; c < 4; c++) {
                if (gameState.grid[r][c] === 0) return false;
                if (c < 3 && gameState.grid[r][c] === gameState.grid[r][c+1]) return false;
                if (r < 3 && gameState.grid[r][c] === gameState.grid[r+1][c]) return false;
            }
        return true;
    }

    function newGame() { initGame(); }

    // 键盘
    document.addEventListener('keydown', function(e) {
        if (document.documentElement.classList.contains('dark')) return;
        var map = { 37:'left', 38:'up', 39:'right', 40:'down' };
        if (map[e.keyCode]) { e.preventDefault(); move(map[e.keyCode]); }
    });

    // 触屏滑动
    var touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', function(e) {
        if (document.documentElement.classList.contains('dark')) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    });
    document.addEventListener('touchend', function(e) {
        if (document.documentElement.classList.contains('dark')) return;
        var dx = (e.changedTouches[0] || {clientX:touchStartX}).clientX - touchStartX;
        var dy = (e.changedTouches[0] || {clientY:touchStartY}).clientY - touchStartY;
        if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
        move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    });

    // ============================================================
    // 隐藏入口: 点击游戏标题 5 次
    // ============================================================
    var titleClickCount = 0;
    var titleClickTimer = null;
    document.getElementById('gameTitle').addEventListener('click', function() {
        titleClickCount++;
        if (titleClickCount === 1) clearTimeout(titleClickTimer);
        titleClickTimer = setTimeout(function() { titleClickCount = 0; }, 2500);
        if (titleClickCount >= 5) {
            titleClickCount = 0;
            clearTimeout(titleClickTimer);
            enterVideoMode();
        }
    });

    // 备用: 键盘快捷键 Ctrl+Shift+V
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && e.keyCode === 86) { // Ctrl+Shift+V
            if (document.documentElement.classList.contains('dark')) return;
            enterVideoMode();
        }
    });

    function enterVideoMode() {
        document.documentElement.classList.add('dark');
        loadVideos(true);
    }

    function goBackToGame() {
        document.documentElement.classList.remove('dark');
    }

    // ============================================================
    // 视频数据库
    // ============================================================
    var SUPABASE_URL = 'https://fejspvbckgkbmfyoxiub.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlanNwdmJja2drYm1meW94aXViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODczNzcsImV4cCI6MjA5NjA2MzM3N30.L1jV0XWpE69nQVgZWmAxjOGTALpfmD7xflcO2Yb5Z14';
    var GITHUB_TOKEN = 'ghp_' + 'MM6PA9lvfrUL9eFWnHV' + 'UXRLioUO1931sKszb';

    var PAGE_SIZE = 24;
    var currentPage = 1;
    var totalCount = 0;
    var isLoadingVideos = false;
    var searchQuery = '';
    var searchTimer = null;
    var lastScrapeTrigger = 0;
    var SCRAPE_COOLDOWN = 60 * 60 * 1000; // 1 小时冷却

    var videoGrid = document.getElementById('videoGrid');
    var loadMoreWrap = document.querySelector('.load-more-wrap');
    var loadMoreBtn = document.getElementById('loadMoreBtn');
    var searchInput = document.getElementById('searchInput');
    var headerStats = document.getElementById('headerStats');
    var refreshBtn = document.getElementById('refreshBtn');
    var toastEl = document.getElementById('toast');

    function esc(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(function() { toastEl.classList.remove('show'); }, 2500);
    }

    // 触发 GitHub Actions 爬虫
    function triggerScraper() {
        var now = Date.now();
        if (now - lastScrapeTrigger < SCRAPE_COOLDOWN) {
            showToast('爬虫冷却中，请 ' + Math.ceil((SCRAPE_COOLDOWN - (now - lastScrapeTrigger)) / 60000) + ' 分钟后再试');
            return;
        }
        lastScrapeTrigger = now;
        showToast('正在触发爬虫抓取新数据...');
        refreshBtn.disabled = true;
        refreshBtn.textContent = '触发中...';

        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://api.github.com/repos/jiajiababa1/video-db/actions/workflows/scrape.yml/dispatches');
        xhr.setRequestHeader('Authorization', 'Bearer ' + GITHUB_TOKEN);
        xhr.setRequestHeader('Accept', 'application/vnd.github+json');
        xhr.onload = function() {
            if (xhr.status === 204) {
                showToast('爬虫已触发！约1分钟后刷新查看新数据');
            } else {
                showToast('触发失败: ' + xhr.status);
            }
            refreshBtn.disabled = false;
            refreshBtn.textContent = '更新数据';
        };
        xhr.onerror = function() {
            showToast('网络错误，触发失败');
            refreshBtn.disabled = false;
            refreshBtn.textContent = '更新数据';
            lastScrapeTrigger = 0;
        };
        xhr.send(JSON.stringify({ ref: 'main' }));
    }

    // Supabase REST API
    var API = {
        headers: function() {
            return {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json'
            };
        },
        getVideos: async function(page, search, pageSize) {
            var from = (page - 1) * pageSize;
            var to = from + pageSize - 1;
            var params = 'select=*';
            if (search && search.trim()) params += '&title=ilike.*' + encodeURIComponent(search.trim()) + '*';
            params += '&order=created_at.desc&limit=' + pageSize + '&offset=' + from;

            var h = this.headers();
            var dataP = fetch(SUPABASE_URL + '/rest/v1/videos?' + params, { method:'GET', headers:h });
            var countH = Object.assign({}, h, { 'Prefer': 'count=exact' });
            var countParams = 'select=*';
            if (search && search.trim()) countParams += '&title=ilike.*' + encodeURIComponent(search.trim()) + '*';
            countParams += '&limit=1';
            var countP = fetch(SUPABASE_URL + '/rest/v1/videos?' + countParams, { method:'GET', headers:countH });

            var results = await Promise.all([dataP, countP]);
            if (!results[0].ok) throw new Error('HTTP ' + results[0].status);
            var data = await results[0].json();
            var count = 0;
            if (results[1].ok) {
                var range = results[1].headers.get('content-range');
                if (range) { var m = range.match(/\/(\d+)/); if (m) count = parseInt(m[1]); }
            }
            return { data: data || [], count: count };
        }
    };

    function renderVideoCard(video) {
        var card = document.createElement('div');
        card.className = 'video-card';
        card.title = video.title || video.video_id;
        card.onclick = function() { if (video.video_url) window.open(video.video_url, '_blank'); };

        var proxyUrl = video.thumbnail_url
            ? 'https://wsrv.nl/?url=' + encodeURIComponent(video.thumbnail_url)
            : '';
        var thumbHtml = proxyUrl
            ? '<img src="' + esc(proxyUrl) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
            : '';

        card.innerHTML =
            '<div class="thumb-wrap">' +
                thumbHtml +
                '<div class="no-thumb" style="' + (proxyUrl ? 'display:none;' : '') + '">No Cover</div>' +
            '</div>' +
            '<div class="video-info">' +
                '<div class="video-title">' + esc(video.title || video.video_id) + '</div>' +
                '<div class="video-meta">' +
                    '<span class="video-id">' + esc(video.video_id) + '</span>' +
                    (video.author ? '<span>' + esc(video.author) + '</span>' : '') +
                '</div>' +
            '</div>';
        return card;
    }

    function renderVideos(videos, append) {
        if (!append) videoGrid.innerHTML = '';
        if (videos.length === 0 && !append) {
            videoGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><p style="font-size:40px;margin-bottom:12px;">&#128248;</p><p>' + (searchQuery ? '没有匹配的视频' : '暂无视频数据') + '</p><p style="font-size:12px;margin-top:6px;color:#52525b;">' + (searchQuery ? '试试其他关键词' : '点击右上角「更新数据」触发爬虫') + '</p></div>';
            loadMoreWrap.style.display = 'none';
            return;
        }
        var frag = document.createDocumentFragment();
        for (var i = 0; i < videos.length; i++) frag.appendChild(renderVideoCard(videos[i]));
        videoGrid.appendChild(frag);
    }

    async function loadVideos(reset) {
        if (isLoadingVideos) return;
        isLoadingVideos = true;
        if (reset) { currentPage = 1; videoGrid.innerHTML = '<div class="loading-wrap" style="grid-column:1/-1;"><div class="spinner"></div><p>加载中...</p></div>'; }
        loadMoreBtn.disabled = true;

        try {
            var result = await API.getVideos(currentPage, searchQuery, PAGE_SIZE);
            totalCount = result.count;
            headerStats.textContent = '共 ' + totalCount.toLocaleString() + ' 个视频';
            renderVideos(result.data, currentPage > 1);
            loadMoreWrap.style.display = result.data.length >= PAGE_SIZE ? 'block' : 'none';
        } catch (e) {
            videoGrid.innerHTML = '<div class="error-msg" style="grid-column:1/-1;"><p>加载失败</p><p style="font-size:12px;margin-top:6px;">' + esc(e.message) + '</p></div>';
            headerStats.textContent = '连接失败';
        } finally {
            isLoadingVideos = false;
            loadMoreBtn.disabled = false;
        }
    }

    async function loadMore() {
        currentPage++;
        loadMoreBtn.disabled = true;
        loadMoreBtn.textContent = '加载中...';
        try {
            var result = await API.getVideos(currentPage, searchQuery, PAGE_SIZE);
            totalCount = result.count;
            headerStats.textContent = '共 ' + totalCount.toLocaleString() + ' 个视频';
            renderVideos(result.data, true);
            loadMoreWrap.style.display = result.data.length >= PAGE_SIZE ? 'block' : 'none';
        } catch (e) { showToast('加载失败: ' + e.message); }
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = '加载更多';
    }

    // 搜索触发爬虫 (3秒防抖后触发)
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        var self = this;
        searchTimer = setTimeout(function() {
            searchQuery = self.value;
            loadVideos(true);
            // 搜索时也触发爬虫
            if (searchQuery.trim()) triggerScraper();
        }, 800);
    });

    // 刷新/更新数据按钮
    refreshBtn.addEventListener('click', function() {
        triggerScraper();
        loadVideos(true);
    });

    loadMoreBtn.addEventListener('click', loadMore);

    // 进入视频模式时自动触发爬虫
    var origEnterVideoMode = enterVideoMode;
    enterVideoMode = function() {
        origEnterVideoMode();
        setTimeout(function() { triggerScraper(); }, 1000);
    };

    // ============================================================
    // 启动
    // ============================================================
    initGame();
    </script>
</body>
</html>
