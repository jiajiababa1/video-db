<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>VideoDB</title>
<style>
/* ============================================================
   VideoDB v3 — 全新设计系统
   深色电影质感 · 卡片布局 · App 级交互
   ============================================================ */
:root {
    --bg: #0a0a0f;
    --bg2: #12121a;
    --card: #1a1a24;
    --border: rgba(255,255,255,.08);
    --text: #f0f0f5;
    --muted: #8a8a99;
    --accent: #e8b84b;
    --accent-dim: rgba(232,184,75,.14);
    --danger: #e05a5a;
    --ok: #5ac87a;
    --radius: 12px;
    --tab-h: 64px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; overflow: hidden;
    user-select: none; -webkit-user-select: none;
}
/* ---------- 密码门 ---------- */
#gate {
    position: fixed; inset: 0; z-index: 1000;
    background: radial-gradient(ellipse 500px 350px at 50% 28%, rgba(232,184,75,.09), transparent), var(--bg);
    display: flex; align-items: center; justify-content: center;
}
#gate.hide { display: none; }
.gate-box { text-align: center; width: 300px; }
.gate-logo { font-size: 34px; font-weight: 800; letter-spacing: 1px; margin-bottom: 6px; }
.gate-logo em { color: var(--accent); font-style: normal; }
.gate-sub { color: var(--muted); font-size: 12px; margin-bottom: 26px; }
.gate-dots { display: flex; gap: 14px; justify-content: center; margin-bottom: 22px; }
.gate-dots input {
    width: 52px; height: 60px; text-align: center; font-size: 26px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); outline: none;
}
.gate-dots input:focus { border-color: var(--accent); }
.gate-dots input.err { border-color: var(--danger); animation: shk .3s; }
@keyframes shk { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.gate-msg { font-size: 12px; min-height: 18px; color: var(--muted); }
.gate-msg.err { color: var(--danger); }
/* ---------- 顶栏 ---------- */
#topbar {
    height: 56px; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; border-bottom: 1px solid var(--border);
    background: rgba(10,10,15,.92); backdrop-filter: blur(12px);
    position: relative; z-index: 50;
}
#topbar .logo { font-weight: 800; font-size: 17px; white-space: nowrap; }
#topbar .logo em { color: var(--accent); font-style: normal; }
#topbar .search {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--card); border-radius: 20px; padding: 8px 14px;
    color: var(--muted); font-size: 13px; cursor: pointer;
    border: 1px solid transparent;
}
#topbar .search:active { border-color: var(--border); }
/* ---------- 视图 ---------- */
#views { position: absolute; top: 56px; bottom: var(--tab-h); left: 0; right: 0; overflow: hidden; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; padding: 14px 14px 20px; }
.view.on { display: block; }
/* ---------- 底部 Tab ---------- */
#tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; height: var(--tab-h);
    display: flex; background: rgba(14,14,20,.96); backdrop-filter: blur(16px);
    border-top: 1px solid var(--border); z-index: 50;
    padding-bottom: env(safe-area-inset-bottom, 0);
}
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--muted); font-size: 10px; cursor: pointer; border: none; background: none; }
.tab .i { font-size: 21px; }
.tab.on { color: var(--accent); }
/* ---------- 视频卡片 ---------- */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.card { background: var(--card); border-radius: var(--radius); overflow: hidden; cursor: pointer; border: 1px solid transparent; }
.card:active { transform: scale(.98); }
.card .thumb { position: relative; aspect-ratio: 16/9; background: #000; overflow: hidden; }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; }
.card .dur {
    position: absolute; right: 6px; bottom: 6px; font-size: 10px;
    background: rgba(0,0,0,.75); padding: 2px 6px; border-radius: 4px;
}
.card .info { padding: 9px 10px 10px; }
.card .t { font-size: 12.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .m { font-size: 11px; color: var(--muted); margin-top: 5px; display: flex; justify-content: space-between; }
/* ---------- 区块标题 ---------- */
.sec-h { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 12px; }
.sec-h:first-child { margin-top: 2px; }
.sec-h h2 { font-size: 16px; font-weight: 700; }
.sec-h a { font-size: 12px; color: var(--accent); }
/* 横滑 */
.hscroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.hscroll .card { flex: 0 0 200px; }
/* ---------- 播放器 ---------- */
#player {
    position: fixed; inset: 0; z-index: 900; background: var(--bg);
    display: none; flex-direction: column;
}
#player.on { display: flex; }
#player .p-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
#player .p-head .back { font-size: 20px; cursor: pointer; padding: 4px 8px; }
#player .p-head .pt { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#player video { width: 100%; background: #000; max-height: 45vh; }
#player .p-body { flex: 1; overflow-y: auto; padding: 14px; }
#player .p-title { font-size: 15px; font-weight: 600; line-height: 1.5; margin-bottom: 8px; }
#player .p-meta { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
#player .p-actions { display: flex; gap: 10px; margin-bottom: 18px; }
.btn {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.acc { background: var(--accent); border-color: var(--accent); color: #1a1405; font-weight: 700; }
.btn.on { border-color: var(--accent); color: var(--accent); }
/* ---------- 搜索 ---------- */
.s-box { display: flex; gap: 8px; margin-bottom: 14px; }
.s-box input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 14px; outline: none;
}
.s-box input:focus { border-color: var(--accent); }
.s-box button { padding: 11px 20px; border-radius: 10px; border: none; background: var(--accent); color: #1a1405; font-weight: 700; cursor: pointer; }
/* ---------- 我的 ---------- */
.me-head { text-align: center; padding: 24px 0 18px; }
.me-head .ava { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-dim);
    display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 10px; }
.me-list { display: flex; flex-direction: column; gap: 2px; }
.me-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 12px;
    background: var(--card); border-radius: var(--radius); cursor: pointer; font-size: 14px;
}
.me-item .i { font-size: 20px; }
.me-item .r { margin-left: auto; color: var(--muted); }
.me-item + .me-item { margin-top: 8px; }
/* 加载 */
.loading { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; }
.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
</style>
</head>
<body>

<!-- 密码门 -->
<div id="gate">
    <div class="gate-box">
        <div class="gate-logo">Video<em>DB</em></div>
        <div class="gate-sub">请输入 4 位密码</div>
        <div class="gate-dots" id="gateDots">
            <input type="password" inputmode="numeric" maxlength="1">
            <input type="password" inputmode="numeric" maxlength="1">
            <input type="password" inputmode="numeric" maxlength="1">
            <input type="password" inputmode="numeric" maxlength="1">
        </div>
        <div class="gate-msg" id="gateMsg"></div>
    </div>
</div>

<!-- 顶栏 -->
<header id="topbar" style="display:none;">
    <div class="logo">Video<em>DB</em></div>
    <div class="search" id="topSearch">🔍 搜索视频、作者…</div>
</header>

<!-- 视图 -->
<main id="views" style="display:none;">
    <section class="view on" id="v-home"></section>
    <section class="view" id="v-browse"></section>
    <section class="view" id="v-search"></section>
    <section class="view" id="v-lib"></section>
    <section class="view" id="v-me"></section>
</main>

<!-- 底部 Tab -->
<nav id="tabbar" style="display:none;">
    <button class="tab on" data-v="v-home"><span class="i">🏠</span><span>首页</span></button>
    <button class="tab" data-v="v-browse"><span class="i">🎬</span><span>视频</span></button>
    <button class="tab" data-v="v-search"><span class="i">🔍</span><span>搜索</span></button>
    <button class="tab" data-v="v-lib"><span class="i">📚</span><span>片库</span></button>
    <button class="tab" data-v="v-me"><span class="i">👤</span><span>我的</span></button>
</nav>

<!-- 播放器 -->
<div id="player">
    <div class="p-head">
        <span class="back" id="pBack">‹</span>
        <span class="pt" id="pTitle"></span>
    </div>
    <video id="pVideo" controls playsinline></video>
    <div class="p-body">
        <div class="p-title" id="pT"></div>
        <div class="p-meta" id="pMeta"></div>
        <div class="p-actions">
            <button class="btn" id="pFav">⭐ 收藏</button>
            <button class="btn" id="pLater">📌 稍后看</button>
            <button class="btn" id="pFollow">👤 关注作者</button>
        </div>
        <div class="sec-h"><h2>相关推荐</h2></div>
        <div class="grid" id="pRelated"></div>
    </div>
</div>

<script>
/* ============================================================
   VideoDB v3 — 100% 全新代码
   ============================================================ */
'use strict';

/* ---------- 配置 ---------- */
const SB = 'https://fejspvbckgkbmfyoxiub.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlanNwdmJja2drYm1meW94aXViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODczNzcsImV4cCI6MjA5NjA2MzM3N30.L1jV0XWpE69nQVgZWmAxjOGTALpfmD7xflcO2Yb5Z14';
const H = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };
const VCOLS = 'video_id,title,author,thumbnail_url,duration,views,created_at,video_url,has_mp4';

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};
function deviceId() {
    let id = store.get('dvc_id', null);
    if (!id) { id = 'dvc-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9); store.set('dvc_id', id); }
    return id;
}
async function api(path) {
    const r = await fetch(SB + path, { headers: H });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
}

/* ---------- 密码门 ---------- */
const gateInputs = [...document.querySelectorAll('#gateDots input')];
const gateMsg = $('#gateMsg');
let failCount = store.get('gate_fail', 0);
let lockUntil = store.get('gate_lock', 0);

function gateCheck() {
    const code = gateInputs.map(i => i.value).join('');
    if (code.length !== 4) return;
    if (Date.now() < lockUntil) {
        gateMsg.textContent = '🔒 已锁定，请 ' + Math.ceil((lockUntil - Date.now()) / 60000) + ' 分钟后再试';
        gateMsg.className = 'gate-msg err';
        return;
    }
    gateMsg.textContent = '验证中…';
    fetch(SB + '/rest/v1/rpc/verify_passcode', {
        method: 'POST', headers: H,
        body: JSON.stringify({ p_code: code, p_device_id: deviceId() })
    }).then(r => r.ok ? r.json() : null).then(j => {
        if (j && j[0] && j[0].ok && j[0].token) {
            store.set('gate_token', j[0].token);
            store.set('gate_ts', Date.now());
            store.set('gate_fail', 0);
            enterApp();
        } else {
            failCount++;
            store.set('gate_fail', failCount);
            if (failCount >= 5) {
                lockUntil = Date.now() + 15 * 60000;
                store.set('gate_lock', lockUntil);
                gateMsg.textContent = '🔒 失败 5 次，已锁定 15 分钟';
            } else {
                gateMsg.textContent = '密码错误，还剩 ' + (5 - failCount) + ' 次';
            }
            gateMsg.className = 'gate-msg err';
            gateInputs.forEach(i => { i.value = ''; i.classList.add('err'); });
            setTimeout(() => gateInputs.forEach(i => i.classList.remove('err')), 500);
            gateInputs[0].focus();
        }
    }).catch(() => {
        gateMsg.textContent = '网络错误，请重试';
        gateMsg.className = 'gate-msg err';
    });
}
gateInputs.forEach((inp, idx) => {
    inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
        if (inp.value && idx < 3) gateInputs[idx + 1].focus();
        gateCheck();
    });
    inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && idx > 0) gateInputs[idx - 1].focus();
    });
});

// 会话检查：2小时有效
function sessionOK() {
    const t = store.get('gate_token', null);
    const ts = store.get('gate_ts', 0);
    return t && (Date.now() - ts < 2 * 3600000);
}
function enterApp() {
    $('#gate').classList.add('hide');
    $('#topbar').style.display = 'flex';
    $('#views').style.display = 'block';
    $('#tabbar').style.display = 'flex';
    loadHome();
}

/* ---------- Tab 切换 ---------- */
document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
        document.querySelectorAll('.view').forEach(x => x.classList.remove('on'));
        t.classList.add('on');
        const v = $('#' + t.dataset.v);
        v.classList.add('on');
        v.scrollTop = 0;
        if (t.dataset.v === 'v-home' && !v.dataset.loaded) loadHome();
        if (t.dataset.v === 'v-browse' && !v.dataset.loaded) loadBrowse();
        if (t.dataset.v === 'v-lib') loadLib();
        if (t.dataset.v === 'v-me') loadMe();
    });
});
$('#topSearch').addEventListener('click', () => {
    document.querySelector('[data-v="v-search"]').click();
    setTimeout(() => $('#sInput').focus(), 100);
});

/* ---------- 视频卡片 ---------- */
function cardHTML(v) {
    return '<div class="card" data-id="' + esc(v.video_id) + '">' +
        '<div class="thumb">' +
        (v.thumbnail_url ? '<img src="' + esc(v.thumbnail_url) + '" loading="lazy" onerror="this.remove()">' : '') +
        (v.duration ? '<span class="dur">' + esc(v.duration) + '</span>' : '') +
        '</div>' +
        '<div class="info"><div class="t">' + esc(v.title || v.video_id) + '</div>' +
        '<div class="m"><span>' + esc(v.author ? '@' + v.author : '') + '</span>' +
        (v.views ? '<span>▶ ' + v.views + '</span>' : '') + '</div></div></div>';
}
function bindCards(el) {
    el.querySelectorAll('.card').forEach(c => {
        c.addEventListener('click', () => openPlayer(c.dataset.id));
    });
}

/* ---------- 首页 ---------- */
async function loadHome() {
    const el = $('#v-home');
    if (el.dataset.loaded) return;
    el.innerHTML = '<div class="loading">加载中…</div>';
    try {
        const hot = await api('/rest/v1/videos?select=' + VCOLS + '&removed=not.is.true&order=views.desc&limit=10');
        const fresh = await api('/rest/v1/videos?select=' + VCOLS + '&removed=not.is.true&order=created_at.desc&limit=12');
        let h = '<div class="sec-h"><h2>🔥 热门</h2></div><div class="hscroll">';
        hot.forEach(v => h += cardHTML(v));
        h += '</div><div class="sec-h"><h2>🆕 最新</h2><a data-go="v-browse">全部 ›</a></div><div class="grid">';
        fresh.forEach(v => h += cardHTML(v));
        h += '</div>';
        el.innerHTML = h;
        el.dataset.loaded = '1';
        bindCards(el);
        el.querySelector('[data-go]').addEventListener('click', () => document.querySelector('[data-v="v-browse"]').click());
    } catch (e) {
        el.innerHTML = '<div class="empty">加载失败，下拉重试</div>';
    }
}

/* ---------- 视频浏览 ---------- */
let browseOffset = 0, browseDone = false;
async function loadBrowse(reset) {
    const el = $('#v-browse');
    if (reset) { browseOffset = 0; browseDone = false; el.innerHTML = ''; delete el.dataset.loaded; }
    if (el.dataset.loaded && !reset) return;
    if (browseDone) return;
    if (!reset) el.innerHTML = '<div class="loading">加载中…</div>';
    try {
        const rows = await api('/rest/v1/videos?select=' + VCOLS + '&removed=not.is.true&order=created_at.desc&limit=24&offset=' + browseOffset);
        if (!reset) el.innerHTML = '<div class="grid" id="browseGrid"></div><div class="loading" id="browseMore">上滑加载更多</div>';
        const g = $('#browseGrid');
        rows.forEach(v => g.insertAdjacentHTML('beforeend', cardHTML(v)));
        bindCards(g);
        browseOffset += rows.length;
        if (rows.length < 24) { browseDone = true; const m = $('#browseMore'); if (m) m.textContent = '— 到底了 —'; }
        el.dataset.loaded = '1';
    } catch (e) {
        el.innerHTML = '<div class="empty">加载失败</div>';
    }
}
// 无限滚动
$('#v-browse').addEventListener('scroll', function() {
    if (this.scrollTop + this.clientHeight > this.scrollHeight - 300) loadBrowse();
});

/* ---------- 搜索 ---------- */
function initSearch() {
    $('#v-search').innerHTML =
        '<div class="s-box"><input id="sInput" placeholder="搜标题、作者…"><button id="sBtn">搜索</button></div>' +
        '<div class="grid" id="sGrid"></div><div class="empty" id="sEmpty" style="display:none;">😶 没有找到</div>';
    const go = async () => {
        const q = $('#sInput').value.trim();
        if (!q) return;
        const g = $('#sGrid');
        g.innerHTML = '<div class="loading">搜索中…</div>';
        $('#sEmpty').style.display = 'none';
        try {
            const terms = q.split(/\s+/).filter(Boolean);
            const ors = [];
            terms.forEach(t => { const e = encodeURIComponent('%' + t + '%'); ors.push('title.ilike.' + e, 'author.ilike.' + e); });
            const rows = await api('/rest/v1/videos?select=' + VCOLS + '&or=(' + ors.join(',') + ')&removed=not.is.true&order=created_at.desc&limit=30');
            g.innerHTML = '';
            if (!rows.length) { $('#sEmpty').style.display = 'block'; return; }
            rows.forEach(v => g.insertAdjacentHTML('beforeend', cardHTML(v)));
            bindCards(g);
        } catch (e) { g.innerHTML = '<div class="empty">搜索失败</div>'; }
    };
    $('#sBtn').addEventListener('click', go);
    $('#sInput').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

/* ---------- 播放器 ---------- */
let curVideo = null;
async function openPlayer(vid) {
    $('#player').classList.add('on');
    $('#pVideo').pause();
    $('#pTitle').textContent = '加载中…';
    $('#pT').textContent = '';
    $('#pRelated').innerHTML = '';
    try {
        const rows = await api('/rest/v1/videos?video_id=eq.' + encodeURIComponent(vid) + '&select=*&limit=1');
        const v = rows[0];
        if (!v) { $('#pTitle').textContent = '视频不存在'; return; }
        curVideo = v;
        $('#pTitle').textContent = v.title || vid;
        $('#pT').textContent = v.title || vid;
        $('#pMeta').textContent = (v.author ? '@' + v.author + ' · ' : '') + (v.views ? '▶ ' + v.views + ' · ' : '') + (v.duration || '');
        // 解析播放地址
        const url = v.video_url || '';
        if (url.includes('.mp4')) {
            $('#pVideo').src = url;
            $('#pVideo').play().catch(() => {});
        } else {
            $('#pTitle').textContent = '⚠ 暂无可播放地址';
        }
        updatePButtons();
        addHistory(vid);
        // 相关推荐
        if (v.author) {
            const rel = await api('/rest/v1/videos?select=' + VCOLS + '&author=eq.' + encodeURIComponent(v.author) + '&video_id=neq.' + encodeURIComponent(vid) + '&removed=not.is.true&limit=8');
            const rg = $('#pRelated');
            rel.forEach(r => rg.insertAdjacentHTML('beforeend', cardHTML(r)));
            bindCards(rg);
        }
    } catch (e) {
        $('#pTitle').textContent = '加载失败';
    }
}
$('#pBack').addEventListener('click', () => {
    $('#player').classList.remove('on');
    $('#pVideo').pause();
    $('#pVideo').src = '';
});
function updatePButtons() {
    if (!curVideo) return;
    const id = curVideo.video_id;
    $('#pFav').classList.toggle('on', store.get('fav', []).includes(id));
    $('#pLater').classList.toggle('on', store.get('later', []).includes(id));
    $('#pFollow').classList.toggle('on', curVideo.author && store.get('follows', []).includes(curVideo.author));
}
function toggleArr(key, val) {
    const a = store.get(key, []);
    const i = a.indexOf(val);
    if (i >= 0) a.splice(i, 1); else a.push(val);
    store.set(key, a);
    return i < 0;
}
$('#pFav').addEventListener('click', () => { if (curVideo) { toggleArr('fav', curVideo.video_id); updatePButtons(); } });
$('#pLater').addEventListener('click', () => { if (curVideo) { toggleArr('later', curVideo.video_id); updatePButtons(); } });
$('#pFollow').addEventListener('click', () => { if (curVideo && curVideo.author) { toggleArr('follows', curVideo.author); updatePButtons(); } });
function addHistory(vid) {
    const h = store.get('hist', []).filter(x => x !== vid);
    h.unshift(vid);
    store.set('hist', h.slice(0, 100));
}

/* ---------- 片库 ---------- */
async function loadLib() {
    const el = $('#v-lib');
    const fav = store.get('fav', []), later = store.get('later', []), hist = store.get('hist', []);
    let h = '<div class="sec-h"><h2>⭐ 我的收藏 (' + fav.length + ')</h2></div>';
    h += await libSection(fav, '还没有收藏');
    h += '<div class="sec-h"><h2>📌 稍后看 (' + later.length + ')</h2></div>';
    h += await libSection(later, '空空如也');
    h += '<div class="sec-h"><h2>🕐 历史 (' + hist.length + ')</h2></div>';
    h += await libSection(hist.slice(0, 20), '还没有观看记录');
    el.innerHTML = h;
    bindCards(el);
}
async function libSection(ids, emptyTxt) {
    if (!ids.length) return '<div class="empty">' + emptyTxt + '</div>';
    try {
        const inList = ids.slice(0, 30).map(id => '"' + encodeURIComponent(id) + '"').join(',');
        const rows = await api('/rest/v1/videos?video_id=in.(' + inList + ')&select=' + VCOLS + '&limit=30');
        const map = {};
        rows.forEach(v => map[v.video_id] = v);
        let h = '<div class="hscroll">';
        ids.slice(0, 30).forEach(id => { if (map[id]) h += cardHTML(map[id]); });
        return h + '</div>';
    } catch (e) { return '<div class="empty">加载失败</div>'; }
}

/* ---------- 我的 ---------- */
function loadMe() {
    const el = $('#v-me');
    el.innerHTML =
        '<div class="me-head"><div class="ava">👤</div><div>本地用户</div>' +
        '<div style="font-size:11px;color:var(--muted);margin-top:4px;">关注 ' + store.get('follows', []).length + ' · 收藏 ' + store.get('fav', []).length + '</div></div>' +
        '<div class="me-list">' +
        '<div class="me-item" id="meAdmin"><span class="i">🛠</span>管理后台<span class="r">›</span></div>' +
        '<div class="me-item" id="meGame"><span class="i">🎮</span>2048 游戏<span class="r">›</span></div>' +
        '<div class="me-item" id="meClear"><span class="i">🗑</span>清理缓存<span class="r">›</span></div>' +
        '<div class="me-item" id="meLock"><span class="i">🔒</span>锁定应用<span class="r">›</span></div>' +
        '</div>';
    $('#meAdmin').addEventListener('click', () => location.href = 'admin.html');
    $('#meGame').addEventListener('click', () => location.href = 'game.html');
    $('#meClear').addEventListener('click', () => {
        ['fav', 'later', 'hist'].forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
        alert('缓存已清理');
    });
    $('#meLock').addEventListener('click', () => {
        try { localStorage.removeItem('gate_token'); } catch(e){}
        location.reload();
    });
}

/* ---------- 启动 ---------- */
initSearch();
if (sessionOK()) {
    enterApp();
} else {
    gateInputs[0].focus();
    if (Date.now() < lockUntil) {
        gateMsg.textContent = '🔒 已锁定，请 ' + Math.ceil((lockUntil - Date.now()) / 60000) + ' 分钟后再试';
        gateMsg.className = 'gate-msg err';
    }
}
