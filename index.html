<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VideoDB - 一站式应用</title>
<link rel="stylesheet" href="assets/common.css">
<style>
    body { background: var(--vbg); color: var(--vtext); min-height: 100vh; }
    .portal { max-width: 1000px; margin: 0 auto; padding: 40px 20px 80px; }
    .hero { text-align: center; margin-bottom: 48px; }
    .hero h1 { font-size: 42px; margin-bottom: 8px; }
    .hero h1 span { color: var(--vprimary); }
    .hero p { color: var(--vmuted); font-size: 15px; }
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .app-card {
        display: block; border: 1px solid var(--vborder); border-radius: 16px;
        padding: 24px 20px; background: var(--vcard); text-decoration: none;
        color: var(--vtext); transition: transform .15s, border-color .15s;
    }
    .app-card:hover { transform: translateY(-3px); border-color: var(--vprimary); }
    .app-card .ico { font-size: 36px; margin-bottom: 12px; display: block; }
    .app-card h3 { font-size: 16px; margin-bottom: 6px; }
    .app-card p { font-size: 12px; color: var(--vmuted); line-height: 1.6; }
    .app-card .tag {
        display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px;
        background: rgba(200,164,92,.12); color: var(--vprimary); margin-top: 10px;
    }
    .portal-foot { text-align: center; margin-top: 48px; color: var(--vmuted); font-size: 12px; }
</style>
</head>
<body>
<div id="vdbNav"></div>
<div class="portal">
    <div class="hero">
        <h1>Video<span>DB</span></h1>
        <p>视频 · 社交 · 游戏，一站式应用</p>
    </div>
    <div class="app-grid">
        <a class="app-card" href="videos.html">
            <span class="ico">🎬</span>
            <h3>视频站</h3>
            <p>浏览热门、最新、排行，发现好视频</p>
            <span class="tag">主站</span>
        </a>
        <a class="app-card" href="search.html">
            <span class="ico">🔍</span>
            <h3>搜索</h3>
            <p>超级搜索：关键词、作者、分区组合查找</p>
        </a>
        <a class="app-card" href="library.html">
            <span class="ico">📚</span>
            <h3>我的库</h3>
            <p>收藏、历史、稍后观看、我的关注</p>
        </a>
        <a class="app-card" href="social.html">
            <span class="ico">💬</span>
            <h3>社交</h3>
            <p>好友、群聊、私信</p>
        </a>
        <a class="app-card" href="game.html">
            <span class="ico">🎮</span>
            <h3>2048</h3>
            <p>经典数字游戏，打发时间</p>
        </a>
        <a class="app-card" href="admin.html">
            <span class="ico">🛠</span>
            <h3>管理后台</h3>
            <p>抓取、补文案、系统状态（管理员）</p>
            <span class="tag">管理员</span>
        </a>
        <a class="app-card" href="settings.html">
            <span class="ico">⚙️</span>
            <h3>设置</h3>
            <p>账号、GitHub/Supabase 配置</p>
        </a>
    </div>
    <div class="portal-foot">VideoDB 一站式应用 · app-v2 架构</div>
</div>
<script src="assets/common.js"></script>
<script src="assets/gate.js"></script>
<script src="assets/api.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/nav.js"></script>
</body>
</html>
